theme: jekyll-theme-cayman
future: true
timezone: Asia/Shanghai
# 的网站基础URL（不含仓库名）
url: "https://keyu233.github.io"
# 项目路径（仓库名，必须以 / 开头）
baseurl: "/different-dimension"

# —————————— 评论（utterances）——————————
# 前置只需一步：安装并授权 https://github.com/apps/utterances 到本仓库
# 每条评论 = 仓库里的一个 Issue，标题按 pathname 映射，首次有人评论时自动创建
# 不需要 repo-id / category-id（这也是它比 giscus 省事的地方）
utterances:
  repo: "KeYu233/different-dimension"
  issue_term: "pathname"
  theme: "github-light"
