  // ---- 右下角：视角上下左右旋转（单击一小步，长按连续转；可上下收起）----
  (function setupOrbitPad() {
    var pad = document.getElementById('orbit-pad');
    var toggle = document.getElementById('orbit-toggle');
    var leftBtn = document.getElementById('orbit-left');
    var rightBtn = document.getElementById('orbit-right');
    var upBtn = document.getElementById('orbit-up');
    var downBtn = document.getElementById('orbit-down');
    var STEP = Math.PI / 36;                 // 单击 5°

    // 水平：动方位角；竖直：动俯仰角（受 min/max 限制）
    function turn(axis, sign, step) {
      if (axis === 'theta') {
        orbit.targetTheta += sign * step;
      } else {
        orbit.targetPhi = Math.max(orbit.minPhi,
                          Math.min(orbit.maxPhi, orbit.targetPhi + sign * step));
      }
    }

    function bind(btn, axis, sign) {
      if (!btn) return;

      btn.addEventListener('click', function () { turn(axis, sign, STEP); });

      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        orbitHold[axis] = sign;
        try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件无捕获权也无妨 */ }
      });
      ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function (type) {
        btn.addEventListener(type, function () { orbitHold[axis] = 0; });
      });
    }

    bind(leftBtn, 'theta', -1);
    bind(rightBtn, 'theta', 1);
    bind(upBtn, 'phi', -1);          // 相机向上抬（俯视方向）
    bind(downBtn, 'phi', 1);

    if (toggle && pad) {
      toggle.addEventListener('click', function () {
        var collapsed = pad.classList.toggle('collapsed');
        toggle.textContent = collapsed ? '⌃' : '⌄';
        toggle.title = collapsed ? '展开' : '收起';
      });
    }

    // 键盘 ← → ↑ ↓ 映射到同一套旋转（按住会连续触发 keydown，可连续转）
    // 输入框内不接管：那边方向键是用来微调数值的
    document.addEventListener('keydown', function (e) {
      var el = e.target;
      var tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

      var step = THREE.MathUtils.degToRad(e.shiftKey ? 30 : 5);
      if (e.key === 'ArrowLeft')       { turn('theta', -1, step); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { turn('theta',  1, step); e.preventDefault(); }
      else if (e.key === 'ArrowUp')    { turn('phi',   -1, step); e.preventDefault(); }
      else if (e.key === 'ArrowDown')  { turn('phi',    1, step); e.preventDefault(); }
    });
  })();

  // ---- 插画：点左上角标题看大图；点空白处 / Esc 关闭 ----
  (function setupArtViewer() {
    var viewer = document.getElementById('art-viewer');
    var title = document.getElementById('brand-title');
    if (!viewer) return;

    function open() { viewer.hidden = false; }
    function close() { viewer.hidden = true; }

    if (title) {
      title.addEventListener('click', open);
      title.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    }

    // 只有点到遮罩空白处才关；点图片本身不关（和看图软件一致）
    viewer.addEventListener('click', function (e) {
      if (e.target === viewer) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !viewer.hidden) close();
    });
  })();

  // ---- 特殊位置截面：平行面（水平/侧/正）+ 垂直面（正垂/侧垂/铅垂）----
  //   只固定"定义真正要求的角"，其余保持用户当前值 —— 例如铅垂面只要
  //   rx=0、rz=90 就一定是竖直平面，ry 只是让这个竖直平面绕竖轴换个方位，
  //   不该被预设强行改掉。
  //   各式的约束（R = Rx·Ry·Rz，法向 = (0,1,0) 经该旋转）：
  //     ∥H  法向竖直   → rx=0, rz=0            （ry 自由）
  //     ∥W  法向沿 X   → rx=90, rz=0           （ry 自由）
  //     ∥V  法向沿 Y   → rx=0, ry=0, rz=90
  //     ⊥V  法向在 XZ  → rz=0                  （rx = 倾角，ry 自由）
  //     ⊥W  法向在 YZ  → rx=0, ry=0            （rz = 倾角）
  //     ⊥H  法向水平   → rx=0, rz=90           （ry 自由）
  //   倾斜类（正垂面 / 侧垂面）的"倾角"本身就是用户的自由参数，不能写死，
  //   只有当前倾角正好是 0（退化成水平面）时才给一个 45° 的默认值。
  var PLANE_PRESETS = {
    h:     { rx: 0,  rz: 0 },            // 水平面
    w:     { rx: 90, rz: 0 },            // 侧平面
    v:     { rx: 0,  ry: 0, rz: 90 },    // 正平面
    vPerp: { rz: 0 },                    // 正垂面：倾角 = 绕 X
    wPerp: { rx: 0,  ry: 0 },            // 侧垂面：倾角 = 绕 Z
    hPerp: { rx: 0,  rz: 90 }            // 铅垂面
  };

  // 倾斜类预设的"倾角钥匙"（用于退化时补默认 45°）
  var PRESET_TILT = { vPerp: { key: 'rx' }, wPerp: { key: 'rz' } };

  // 平面姿态以 180° 为周期（法向反向仍是同一平面）
  function samePlaneAngle(a, b) {
    var d = Math.abs(((a - b) % 180 + 180) % 180);
    return d < 0.5 || d > 179.5;
  }

  // 预设是否"当前成立"：只比对它固定了的那些角（没写的角是自由的）
  function presetMatches(p) {
    for (var k in p) {
      if (!Object.prototype.hasOwnProperty.call(p, k)) continue;
      if (!samePlaneAngle(state[k], p[k])) return false;
    }
    return true;
  }

  function markPlanePreset() {
    Array.prototype.forEach.call(document.querySelectorAll('.preset-btn'), function (btn) {
      var p = PLANE_PRESETS[btn.getAttribute('data-plane')];
      btn.classList.toggle('active', !!p && presetMatches(p));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.preset-btn'), function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-plane');
      var p = PLANE_PRESETS[key];
      if (!p) return;

      // 只写预设里出现过的角；没写的保持用户当前值
      ['rx', 'ry', 'rz'].forEach(function (k) {
        if (p[k] === undefined) return;
        if (FIELD_BY_KEY[k]) FIELD_BY_KEY[k].setValue(p[k], true);
      });

      // 倾斜类：倾角是用户的自由参数，原样保留；只有当前倾角退化成 0（水平面）时才补 45°
      var tilt = PRESET_TILT[key];
      if (tilt && FIELD_BY_KEY[tilt.key] && samePlaneAngle(state[tilt.key], 0)) {
        FIELD_BY_KEY[tilt.key].setValue(45, true);
      }

      updateSection();
    });
  });

  // ---- 视角播放：▶/⏸ + 1x/1.5x/2x/5x ----
  (function setupPlay() {
    var playBtn = document.getElementById('play-btn');
    var speedGroup = document.getElementById('speed-group');
    if (!playBtn || !speedGroup) return;

    var speedBtns = speedGroup.querySelectorAll('.speed-btn');

    function render() {
      playBtn.classList.toggle('on', state.playing);
      playBtn.textContent = state.playing ? '⏸ 暂停' : '▶ 播放';
      Array.prototype.forEach.call(speedBtns, function (b) {
        var v = parseFloat(b.getAttribute('data-speed'));
        b.classList.toggle('active', Math.abs(v - state.playSpeed) < 1e-6);
      });
    }

    playBtn.addEventListener('click', function () {
      state.playing = !state.playing;
      render();
    });

    Array.prototype.forEach.call(speedBtns, function (b) {
      b.addEventListener('click', function () {
        state.playSpeed = parseFloat(b.getAttribute('data-speed')) || 1;
        render();
      });
    });

    render();
  })();

  // ---- 视图定向：主 / 左 / 俯（与右上角三视图的投影方向一致）----
  //   主视图：从 +x（Y 向进深）看 → 屏幕右 = −z、屏幕上 = +y
  //   左视图：从 +z 看             → 屏幕右 = +x、屏幕上 = +y
  //   俯视图：从上方看             → 屏幕右 = −z、屏幕上 = −x
  var VIEW_PRESET = {
    front: { theta: Math.PI / 2, phi: Math.PI / 2 },
    side:  { theta: 0, phi: Math.PI / 2 },
    top:   { theta: Math.PI / 2, phi: 0.01 }   // 与拖拽限位一致，点按钮和手拖到顶是同一个视角
  };

  // 取与当前角最接近的等价角，避免相机绕远路转一圈
  function nearestAngle(from, to) {
    var t = to;
    while (t - from > Math.PI) t -= Math.PI * 2;
    while (t - from < -Math.PI) t += Math.PI * 2;
    return t;
  }

  Array.prototype.forEach.call(document.querySelectorAll('.view-btn'), function (btn) {
    btn.addEventListener('click', function () {
      var p = VIEW_PRESET[btn.getAttribute('data-view')];
      if (!p) return;
      orbit.targetTheta = nearestAngle(orbit.theta, p.theta);
      orbit.targetPhi = p.phi;
      orbit.target.set(0, orbit.homeTargetY, 0);   // 回到立体中心，保留当前缩放
    });
  });

  // ---- 重置视角 ----
  document.getElementById('reset').addEventListener('click', function () {
    orbit.targetTheta = HOME.theta;
    orbit.targetPhi = HOME.phi;
    orbit.targetDist = HOME.dist;
    orbit.target.set(0, orbit.homeTargetY, 0);
  });

  /* ==========================================================
   * 7. 自适应尺寸 + 渲染循环
   * ========================================================== */

  // 尺寸变化只在"渲染之前"统一处理：
  //   ResizeObserver / window.resize 只置位，真正 setSize 放到 animate 里、
  //   render 之前——否则 setSize 清空画布后本帧不会再画，侧边栏动画期间会整屏发黑。
  var needResize = true;

  function applyResize() {
    var w = container.clientWidth;
    var h = container.clientHeight;
    if (!w || !h) return;          // 尺寸还没出来：保持待办，下一帧再试
    needResize = false;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  function resize() { needResize = true; }

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(container);

  // 播放：1x = 24°/s（15 秒转一圈），方位角增大＝俯视看顺时针（画面正面往左转）
  var PLAY_DEG_PER_SEC = 24;
  var lastFrameTime = 0;
  // 长按持续旋转：theta = 左右（-1 / +1），phi = 上下（-1 / +1）
  var orbitHold = { theta: 0, phi: 0 };
  var HOLD_DEG_PER_SEC = 70;

  function animate(now) {
    requestAnimationFrame(animate);

    if (needResize) applyResize();

    now = now || 0;
    var dt = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.1) : 0;
    lastFrameTime = now;

    if ((orbitHold.theta || orbitHold.phi) && dt > 0) {
      var holdStep = THREE.MathUtils.degToRad(HOLD_DEG_PER_SEC) * dt;
      if (orbitHold.theta) orbit.targetTheta += orbitHold.theta * holdStep;
      if (orbitHold.phi) {
        orbit.targetPhi = Math.max(orbit.minPhi,
                          Math.min(orbit.maxPhi, orbit.targetPhi + orbitHold.phi * holdStep));
      }
    }

    if (state.playing && dt > 0) {
      orbit.targetTheta += THREE.MathUtils.degToRad(PLAY_DEG_PER_SEC * state.playSpeed) * dt;
      // 长时间播放后把角度折回，避免数值无限增长（两个角一起平移 2π 的整数倍，画面不变）
      if (Math.abs(orbit.targetTheta) > 1e4) {
        var k = Math.round(orbit.targetTheta / (Math.PI * 2)) * Math.PI * 2;
        orbit.targetTheta -= k;
        orbit.theta -= k;
      }
    }

    updateCamera();
    renderer.render(scene, camera);
  }

  /* ==========================================================
   * 8. 启动
   * ========================================================== */

  resize();
  buildSolid(state.solid);   // 默认圆锥
  refreshDimUI();            // 立体尺寸栏按当前立体初始化
  animate();
})();
</script>
</body>
</html>
