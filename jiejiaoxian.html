<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立体截交线 · 三维交互演示</title>
<!--
  ================================================================
  立体截交线 Web 端三维交互可视化系统 —— 基础框架 (MVP)
  ----------------------------------------------------------------
  · 完全离线单文件：Three.js r128 已内联在页面底部，无任何外部请求
  · 不使用 ES Module / import，直接以全局 THREE 使用
  · 鼠标交互为自写的简易 OrbitControls（拖拽旋转 / 滚轮缩放 / 右键平移）
  ================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    overflow: hidden;
    background: #1a1a24;
    color: #e6e8f2;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ==================== 左侧侧边栏 ==================== */
  #sidebar {
    flex: 0 0 300px;
    width: 300px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 16px 16px;
    background: #1e1e2d;
    border-right: 1px solid #2b2b40;
    overflow-y: auto;
    overflow-x: hidden;
    transition: margin-left .32s cubic-bezier(.4, 0, .2, 1);
  }
  #sidebar.collapsed { margin-left: -300px; }

  /* 收起 / 展开：贴在侧边栏右缘的小拉手 */
  #sidebar-toggle {
    position: fixed;
    top: 50%;
    left: 276px;
    width: 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(-50%);
    z-index: 60;
    font-size: 13px;
    color: #8b93b8;
    background: rgba(38, 38, 56, .92);
    border: 1px solid #34344e;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    transition: left .32s cubic-bezier(.4, 0, .2, 1), border-radius .32s,
                background .15s, color .15s;
  }
  #sidebar-toggle:hover { background: #2e2e4a; color: #dfe7ff; border-color: #4f8cff; }
  #sidebar-toggle.collapsed {
    left: 0;
    border-radius: 0 8px 8px 0;
    border-left: 0;
  }
  #sidebar::-webkit-scrollbar { width: 8px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: #34344e; border-radius: 4px; }
  #sidebar::-webkit-scrollbar-thumb:hover { background: #43436a; }

  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; color: #f2f4ff; }
  .brand h1 em { font-style: normal; color: #4f8cff; }
  /* 标题可点：点开插画大图 */
  #brand-title {
    display: inline-block;
    cursor: pointer;
    user-select: none;
    transition: opacity .15s, text-shadow .15s;
  }
  #brand-title:hover { opacity: .88; text-shadow: 0 0 14px rgba(79, 140, 255, .45); }
  #brand-title:focus-visible { outline: 2px solid #4f8cff; outline-offset: 3px; border-radius: 4px; }
  .brand p { margin-top: 6px; font-size: 11.5px; letter-spacing: .4px; color: #7b80a0; }
  .brand .brand-motto {
    margin-top: 2px;
    font-size: 11px;
    letter-spacing: .6px;
    color: #c98fb0;
  }

  /* 放进博客后加的：回博客首页 */
  .brand .back-blog {
    display: inline-block;
    margin-top: 10px;
    padding-bottom: 1px;
    font-size: 12px;
    color: #8b93b8;
    text-decoration: none;
    border-bottom: 1px dashed #3a3a55;
    transition: color .15s, border-color .15s;
  }
  .brand .back-blog:hover { color: #dfe7ff; border-bottom-color: #4f8cff; }

  .panel {
    padding: 13px 13px 15px;
    background: rgba(34, 34, 49, .55);
    border: 1px solid #2c2c42;
    border-radius: 10px;
  }
  .panel-title {
    margin-bottom: 11px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: #8b93b8;
  }

  /* ---- 立体选择按钮 ---- */
  .solid-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .solid-btn {
    padding: 9px 4px;
    font-family: inherit;
    font-size: 12.5px;
    color: #c3c8e0;
    background: #292940;
    border: 1px solid #383853;
    border-radius: 7px;
    cursor: pointer;
    transition: background .18s, border-color .18s, color .18s, box-shadow .18s;
  }
  .solid-btn:hover { border-color: #4f8cff; color: #dfe7ff; background: #2e2e4a; }
  .solid-btn.active {
    background: linear-gradient(180deg, #4f8cff, #3b73e0);
    border-color: #5c96ff;
    color: #ffffff;
    box-shadow: 0 2px 12px rgba(79, 140, 255, .32);
  }
  /* 9 个立体排 3 列：正好 3 行 */
  .solid-btn { }


  /* ---- 滑块 ---- */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  /* 特殊位置截面：水平面 / 侧平面 / 正平面 */
  .plane-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 13px;
  }
  .preset-btn {
    padding: 6px 2px;
    font-family: inherit;
    font-size: 11.5px;
    color: #b9c0da;
    background: #24243a;
    border: 1px solid #34344e;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .preset-btn:hover { border-color: #4f8cff; color: #e3e8ff; background: #2c2c46; }
  .preset-btn:active { transform: scale(.97); }
  .preset-btn.active {
    background: rgba(79, 140, 255, .18);
    border-color: #4f8cff;
    color: #dbe6ff;
  }
  .field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }
  .field-head label { font-size: 12.5px; color: #c3c8e0; }
  .val {
    min-width: 56px;
    padding: 1px 7px;
    font-family: Consolas, "SF Mono", Menlo, monospace;
    font-size: 11.5px;
    text-align: center;
    color: #8fb6ff;
    background: rgba(79, 140, 255, .14);
    border-radius: 5px;
  }

  /* 值可以直接输入：滑条负责粗调，这里负责精确值 */
  .val-input {
    width: 66px;
    min-width: 0;
    padding: 3px 6px;
    border: 1px solid transparent;
    outline: none;
    cursor: text;
    transition: border-color .15s, background .15s, color .15s;
  }
  .val-input:hover { border-color: rgba(79, 140, 255, .45); }
  .val-input:focus {
    border-color: #4f8cff;
    background: rgba(79, 140, 255, .22);
    color: #dbe6ff;
  }
  .val-input.invalid {
    border-color: #ff5f6d;
    background: rgba(255, 95, 109, .14);
    color: #ff9aa2;
  }
  .field-err {
    margin-top: 7px;
    font-size: 11px;
    line-height: 1.45;
    color: #ff8f97;
  }

  .field-side { display: flex; align-items: center; gap: 6px; }

  /* 单项重置：只重置自己那一个参数 */
  .reset-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    color: #8b93b8;
    background: transparent;
    border: 1px solid #383853;
    border-radius: 6px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .reset-btn:hover {
    color: #dbe4ff;
    border-color: #4f8cff;
    background: rgba(79, 140, 255, .1);
  }
  .reset-btn:active { transform: scale(.94); }

  /* ==================== 三视图面板（右上角，可拖拽缩放）==================== */
  .views-panel {
    position: absolute;
    top: 16px;
    right: 18px;
    padding: 10px 12px 8px;
    background: rgba(22, 22, 34, .84);
    border: 1px solid #33334c;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .views-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 13px;
    letter-spacing: 1.2px;
    color: #a6adc9;
  }
  .views-head span { font-size: 12px; letter-spacing: .3px; color: #8a90ae; }

  /* 每个视图各自的显示开关（轮廓 / 截交线） */
  .views-toggles {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 0 0 9px;
    padding-bottom: 9px;
    border-bottom: 1px solid rgba(60, 60, 88, .5);
    pointer-events: auto;
  }
  .vt-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    line-height: 1;
    color: #a6adc9;
  }
  .vt-name { width: 44px; color: #8a90ae; }
  .vt-row label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }
  .vt-row label:hover { color: #c3c8e0; }
  .vt-row input {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: #4f8cff;
    cursor: pointer;
  }
  #views-canvas { display: block; }

  /* 左下角缩放柄：拖它就等于"拖图片角点" */
  .views-grip {
    position: absolute;
    left: 2px;
    bottom: 2px;
    width: 18px;
    height: 18px;
    border-left: 2px solid #45456a;
    border-bottom: 2px solid #45456a;
    border-bottom-left-radius: 7px;
    cursor: nesw-resize;
    pointer-events: auto;
    transition: border-color .15s;
  }
  .views-grip:hover { border-color: #4f8cff; }

  /* 右下角的收起 / 展开（那块是画布里的空白区，正好腾出来放它） */
  .views-collapse {
    position: absolute;
    right: 6px;
    bottom: 5px;
    width: 26px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 13px;
    line-height: 1;
    color: #8b93b8;
    background: rgba(40, 40, 60, .9);
    border: 1px solid #3a3a58;
    border-radius: 6px;
    cursor: pointer;
    pointer-events: auto;
    transition: color .15s, background .15s, border-color .15s;
  }
  .views-collapse:hover { color: #dfe7ff; border-color: #4f8cff; background: #2e2e4a; }

  /* 收起：只留标题栏和这个按钮（不做动画） */
  .views-panel.collapsed .views-toggles,
  .views-panel.collapsed #views-canvas,
  .views-panel.collapsed .views-grip { display: none; }
  .views-panel.collapsed { padding-bottom: 6px; }
  .views-panel.collapsed .views-collapse { position: static; margin: 6px 0 0 auto; }
  .views-panel.collapsed .views-head { margin-bottom: 0; }
  .views-panel.collapsed .views-head span { display: none; }

  /* ---- 显示选项（复选框）---- */
  .check-list { display: flex; flex-direction: column; gap: 9px; }
  .check-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: #c3c8e0;
    cursor: pointer;
    user-select: none;
  }
  .check-item input {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: #4f8cff;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .check-item:hover { color: #e3e8ff; }

  /* ---- 视图定向按钮 ---- */
  .view-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .view-btn {
    padding: 7px 2px;
    font-family: inherit;
    font-size: 12px;
    color: #c3c8e0;
    background: #292940;
    border: 1px solid #383853;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .view-btn:hover { border-color: #4f8cff; color: #dfe7ff; background: #2e2e4a; }
  .view-btn:active { transform: scale(.96); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    background: #34344e;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #4f8cff;
    border: 2px solid #1e1e2d;
    border-radius: 50%;
    box-shadow: 0 0 0 1px #4f8cff, 0 0 8px rgba(79, 140, 255, .5);
    transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 11px;
    height: 11px;
    background: #4f8cff;
    border: 2px solid #1e1e2d;
    border-radius: 50%;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 5px;
    background: #34344e;
    border-radius: 3px;
  }

  /* ---- 底部提示 ---- */
  .hint { margin-top: auto; padding-top: 2px; }
  .hint p { font-size: 11.5px; line-height: 1.9; color: #767c9c; }
  .ghost-btn {
    width: 100%;
    margin-top: 11px;
    padding: 8px;
    font-family: inherit;
    font-size: 12.5px;
    color: #a9b0cc;
    background: transparent;
    border: 1px solid #383853;
    border-radius: 7px;
    cursor: pointer;
    transition: background .18s, border-color .18s, color .18s;
  }
  .ghost-btn:hover { border-color: #4f8cff; color: #dbe4ff; background: rgba(79, 140, 255, .08); }

  /* ==================== 右侧 3D 视口 ==================== */
  #viewport {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    background: #1a1a24;
  }
  #viewport canvas { display: block; }

  /* 右下角：视角左右转 + 上下收起 */
  .orbit-pad {
    position: absolute;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 7px;
    background: rgba(30, 30, 45, .78);
    border: 1px solid #33334c;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    transition: padding .28s cubic-bezier(.4, 0, .2, 1);
  }
  .orbit-toggle {
    height: 18px;
    font-family: inherit;
    font-size: 11px;
    line-height: 1;
    color: #8b93b8;
    background: transparent;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .orbit-toggle:hover { color: #dfe7ff; background: rgba(79, 140, 255, .14); }
  .orbit-body {
    display: grid;
    grid-template-columns: repeat(3, 66px);
    grid-template-rows: repeat(2, 46px);
    gap: 6px;
    overflow: hidden;
    max-height: 104px;
    min-height: 0;                 /* flex 项默认 min-height:auto，会顶住 max-height 收不下去 */
    transition: max-height .28s cubic-bezier(.4, 0, .2, 1), opacity .2s;
  }
  .orbit-pad.collapsed { padding: 4px 7px; }
  .orbit-pad.collapsed .orbit-body { max-height: 0; opacity: 0; }
  .orbit-btn {
    width: 66px;
    height: 46px;
    font-family: inherit;
    font-size: 19px;
    line-height: 1;
    color: #c3c8e0;
    background: #292940;
    border: 1px solid #383853;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .orbit-btn:hover { border-color: #4f8cff; color: #dfe7ff; background: #2e2e4a; }
  .orbit-btn:active { transform: scale(.95); }
  /* 十字布局：上↖ 中下 ↙ → 排成 D-pad 形 */
  #orbit-up    { grid-column: 2; grid-row: 1; }
  #orbit-down  { grid-column: 2; grid-row: 2; }
  #orbit-left  { grid-column: 1; grid-row: 2; }
  #orbit-right { grid-column: 3; grid-row: 2; }


  .vp-tag {
    position: absolute;
    top: 16px;
    left: 18px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: .3px;
    color: #a9b0cc;
    background: rgba(30, 30, 45, .78);
    border: 1px solid #33334c;
    border-radius: 7px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .vp-tag strong { font-weight: 600; color: #e9ecff; }

  .vp-note {
    position: absolute;
    top: 58px;
    left: 18px;
    padding: 6px 12px;
    font-size: 11.5px;
    color: #e7c07a;
    background: rgba(42, 33, 20, .8);
    border: 1px solid #5c4a28;
    border-radius: 7px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }

  .legend {
    position: absolute;
    bottom: 16px;
    left: 18px;
    display: flex;
    gap: 15px;
    padding: 7px 12px;
    font-size: 11.5px;
    color: #8b93b8;
    background: rgba(30, 30, 45, .78);
    border: 1px solid #33334c;
    border-radius: 7px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .legend span { display: flex; align-items: center; }
  .legend i {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 6px;
    border-radius: 2px;
  }
  .legend .c-solid { background: #5b8def; }
  .legend .c-plane { background: #ff8fb1; }
  .legend .c-line { background: #2ee87f; }

  /* ---- 插画大图（点左上角标题打开）---- */
  .art-viewer {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 8, 14, .88);
    backdrop-filter: blur(4px);
    cursor: zoom-out;
  }
  .art-viewer[hidden] { display: none; }
  .art-viewer img {
    max-width: 88vw;
    max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
  }

  /* ---- 视角播放：与侧边栏其他控件同一套版式（全宽按钮 + 等分档位）---- */
  .play-row { display: flex; flex-direction: column; gap: 8px; }
  .play-btn {
    width: 100%;
    padding: 8px;
    font-family: inherit;
    font-size: 12.5px;
    color: #c3c8e0;
    background: #292940;
    border: 1px solid #383853;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .play-btn:hover { border-color: #4f8cff; color: #dfe7ff; background: #2e2e4a; }
  .play-btn.on {
    background: linear-gradient(180deg, #4f8cff, #3b73e0);
    border-color: #5c96ff;
    color: #fff;
    box-shadow: 0 2px 12px rgba(79, 140, 255, .32);
  }
  .speed-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .speed-btn {
    padding: 6px 0;
    font-family: inherit;
    font-size: 11.5px;
    color: #b9c0da;
    background: #24243a;
    border: 1px solid #34344e;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .speed-btn:hover { border-color: #4f8cff; color: #e3e8ff; background: #2c2c46; }
  .speed-btn:active { transform: scale(.97); }
  .speed-btn.active {
    background: rgba(79, 140, 255, .18);
    border-color: #4f8cff;
    color: #dbe6ff;
  }
</style>
</head>
<body>

  <!-- ==================== 侧边栏 ==================== -->
  <button id="sidebar-toggle" type="button" title="收起侧边栏">«</button>
  <aside id="sidebar">
    <div class="brand">
      <h1 id="brand-title" role="button" tabindex="0" title="点击查看插画">立体<em>截交线</em></h1>
      <p>三维交互可视化 · 基础框架</p>
      <p class="brand-motto">SOS~让世界变得更加热闹！</p>
      <a class="back-blog" href="./">← 返回博客</a>
    </div>

    <section class="panel">
      <h2 class="panel-title">视角播放</h2>
      <div class="play-row">
        <button class="play-btn" id="play-btn" type="button"
                title="以当前视角持续旋转（俯视看为顺时针）">▶ 播放</button>
        <div class="speed-group" id="speed-group">
          <button class="speed-btn active" data-speed="1" type="button" title="1 倍速（15 秒一圈）">1x</button>
          <button class="speed-btn" data-speed="1.5" type="button" title="1.5 倍速">1.5x</button>
          <button class="speed-btn" data-speed="2" type="button" title="2 倍速">2x</button>
          <button class="speed-btn" data-speed="5" type="button" title="5 倍速">5x</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">选择立体</h2>
      <div class="solid-grid" id="solid-grid">
        <button class="solid-btn" data-solid="prism" type="button">正六棱柱</button>
        <button class="solid-btn" data-solid="prism4" type="button">四棱柱</button>
        <button class="solid-btn" data-solid="prismFrustum" type="button">正六棱台</button>
        <button class="solid-btn" data-solid="frustum4" type="button">四棱台</button>
        <button class="solid-btn" data-solid="pyramid3" type="button">三棱锥</button>
        <button class="solid-btn" data-solid="pyramid4" type="button">四棱锥</button>
        <button class="solid-btn" data-solid="cylinder" type="button">圆柱</button>
        <button class="solid-btn active" data-solid="cone" type="button">圆锥</button>
        <button class="solid-btn" data-solid="sphere" type="button">球</button>
      </div>
    </section>

    <section class="panel" id="dim-panel">
      <h2 class="panel-title">立体尺寸</h2>
      <div class="field" id="dim-h-field">
        <div class="field-head">
          <label for="dim-h">高度</label>
          <div class="field-side">
            <input class="val val-input" id="dim-h-val" type="text" inputmode="decimal" value="3.00"
                   autocomplete="off" spellcheck="false" aria-label="立体高度，可输入 0.6 ~ 7">
            <button class="reset-btn" id="dim-h-reset" type="button" title="重置高度" aria-label="重置高度">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="dim-h" min="0.6" max="7" step="0.05" value="3">
        <p class="field-err" id="dim-h-err" role="alert" hidden></p>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="dim-size" id="dim-size-label">底边长</label>
          <div class="field-side">
            <input class="val val-input" id="dim-size-val" type="text" inputmode="decimal" value="1.30"
                   autocomplete="off" spellcheck="false" aria-label="底面尺寸">
            <button class="reset-btn" id="dim-size-reset" type="button" title="重置底面尺寸" aria-label="重置底面尺寸">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="dim-size" min="0.4" max="4" step="0.05" value="1.3">
        <p class="field-err" id="dim-size-err" role="alert" hidden></p>
      </div>
      <button class="ghost-btn" id="cube-btn" type="button" hidden
              title="把底边长和高度统一成两者中较长的那个">快速调整为正方体</button>
    </section>

    <section class="panel">
      <h2 class="panel-title">截面位置</h2>
      <div class="field">
        <div class="field-head">
          <label for="pos">沿轴线高度</label>
          <div class="field-side">
            <input class="val val-input" id="pos-val" type="text" inputmode="decimal" value="1.60"
                   autocomplete="off" spellcheck="false" aria-label="沿轴线高度，可输入 -2 ~ 4">
            <button class="reset-btn" data-reset="sectionY" type="button"
                    title="重置截面位置" aria-label="重置截面位置">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="pos" min="-2" max="4" step="0.01" value="1.6">
        <p class="field-err" id="pos-err" role="alert" hidden></p>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">截面旋转</h2>
      <div class="plane-presets">
        <button class="preset-btn" data-plane="h" type="button"
                title="水平面 ∥H：只固定 绕X=0、绕Z=0（绕Y 自由）">水平面</button>
        <button class="preset-btn" data-plane="w" type="button"
                title="侧平面 ∥W：只固定 绕X=90、绕Z=0（绕Y 自由）">侧平面</button>
        <button class="preset-btn" data-plane="v" type="button"
                title="正平面 ∥V：固定 绕X=0、绕Y=0、绕Z=90">正平面</button>
        <button class="preset-btn" data-plane="vPerp" type="button"
                title="正垂面 ⊥V：固定 绕Z=0（绕X = 倾角，保留你的值）">正垂面</button>
        <button class="preset-btn" data-plane="wPerp" type="button"
                title="侧垂面 ⊥W：固定 绕X=0、绕Y=0（绕Z = 倾角，保留你的值）">侧垂面</button>
        <button class="preset-btn" data-plane="hPerp" type="button"
                title="铅垂面 ⊥H：只固定 绕X=0、绕Z=90（绕Y 自由，用来换竖直平面的方位）">铅垂面</button>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="rx">绕 X 轴</label>
          <div class="field-side">
            <input class="val val-input" id="rx-val" type="text" inputmode="numeric" value="0°"
                   autocomplete="off" spellcheck="false" aria-label="绕 X 轴角度，可输入 -180 ~ 180">
            <button class="reset-btn" data-reset="rx" type="button"
                    title="重置绕 X 轴角度" aria-label="重置绕 X 轴角度">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="rx" min="-180" max="180" step="1" value="0">
        <p class="field-err" id="rx-err" role="alert" hidden></p>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="ry">绕 Y 轴</label>
          <div class="field-side">
            <input class="val val-input" id="ry-val" type="text" inputmode="numeric" value="0°"
                   autocomplete="off" spellcheck="false" aria-label="绕 Y 轴角度，可输入 -180 ~ 180">
            <button class="reset-btn" data-reset="ry" type="button"
                    title="重置绕 Y 轴角度" aria-label="重置绕 Y 轴角度">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="ry" min="-180" max="180" step="1" value="0">
        <p class="field-err" id="ry-err" role="alert" hidden></p>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="rz">绕 Z 轴</label>
          <div class="field-side">
            <input class="val val-input" id="rz-val" type="text" inputmode="numeric" value="0°"
                   autocomplete="off" spellcheck="false" aria-label="绕 Z 轴角度，可输入 -180 ~ 180">
            <button class="reset-btn" data-reset="rz" type="button"

              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"

                <path d="M13.2 8a5.2 5.2 0 1 1-1.53-3.68"/><path d="M13.2 2.9v3h-3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="rz" min="-180" max="180" step="1" value="0">
        <p class="field-err" id="rz-err" role="alert" hidden></p>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">显示选项</h2>
      <div class="check-list">

          <input type="checkbox" id="show-solid" checked><span>显示实体</span>

<script>
(function () {
  'use strict';

  /* ==========================================================
   * 0. 数据与状态
   * ========================================================== */

  // 九类基本立体：kind + 数学参数。网格只是这些参数的表现，
  // 求交用的是同一套参数（保证"算出来的线"一定落在"画出来的面"上）
  //   kind  : prism（棱柱/棱台/棱锥，用 sides/rBot/rTop）| cylinder | cone | sphere
  //   taper : rTop / rBot 的固定比例（1 = 柱，0 = 锥，其它 = 台）
  //   dims  : 用户可调的两个尺寸
  //             h    —— 高度（球没有，球的高恒为 2r）
  //             size —— 棱类 = 底边长；圆柱/圆锥 = 底面半径；球 = 半径
  var SOLIDS = {
    prism:        { label: '正六棱柱', kind: 'prism',    sides: 6, rBot: 1.30, rTop: 1.30, h: 3.00, taper: 1.0,    flat: true,  dims: { h: 3.00, size: 1.300 } },
    prism4:       { label: '四棱柱',   kind: 'prism',    sides: 4, rBot: 1.35, rTop: 1.35, h: 3.00, taper: 1.0,    flat: true,  dims: { h: 3.00, size: 1.909 } },
    prismFrustum: { label: '正六棱台', kind: 'prism',    sides: 6, rBot: 1.30, rTop: 0.78, h: 3.00, taper: 0.6,    flat: true,  dims: { h: 3.00, size: 1.300 } },
    frustum4:     { label: '四棱台',   kind: 'prism',    sides: 4, rBot: 1.35, rTop: 0.80, h: 3.00, taper: 0.5926, flat: true,  dims: { h: 3.00, size: 1.909 } },
    pyramid3:     { label: '三棱锥',   kind: 'prism',    sides: 3, rBot: 1.50, rTop: 0.00, h: 3.00, taper: 0.0,    flat: true,  dims: { h: 3.00, size: 2.598 } },
    pyramid4:     { label: '四棱锥',   kind: 'prism',    sides: 4, rBot: 1.35, rTop: 0.00, h: 3.00, taper: 0.0,    flat: true,  dims: { h: 3.00, size: 1.909 } },
    cylinder:     { label: '圆柱',     kind: 'cylinder',             rBot: 1.25, rTop: 1.25, h: 3.00, taper: 1.0,    flat: false, dims: { h: 3.00, size: 1.250 } },
    cone:         { label: '圆锥',     kind: 'cone',                 rBot: 1.45, rTop: 0.00, h: 3.20, taper: 0.0,    flat: false, dims: { h: 3.20, size: 1.450 } },
    sphere:       { label: '球',       kind: 'sphere',   rBot: 1.50, r: 1.50, h: 3.00,   taper: 1.0,  flat: false, dims: { h: 3.00, size: 1.500 } }
  };

  // 记下出厂尺寸，供"单项重置"用
  Object.keys(SOLIDS).forEach(function (k) {
    SOLIDS[k].init = { h: SOLIDS[k].dims.h, size: SOLIDS[k].dims.size };
  });

  // 由 dims 反算几何参数：棱类要把"边长"换算成外接圆半径
  function applyDims(def) {
    var d = def.dims;
    if (def.kind === 'sphere') {
      def.r = d.size;
      def.rBot = d.size;
      def.h = d.size * 2;
      return;
    }
    def.h = d.h;
    var R = (def.kind === 'prism')
      ? d.size / (2 * Math.sin(Math.PI / def.sides))   // 正 n 边形：边长 → 外接圆半径
      : d.size;
    def.rBot = R;
    def.rTop = R * def.taper;
  }

  // 每种立体暴露哪些尺寸控件
  // 注意：棱类的底边长上限必须 ≥ 高度上限，否则"快速调整为正方体"会被上限裁掉
  function dimSpec(def) {
    if (def.kind === 'sphere') {
      return { hasHeight: false, sizeLabel: '半径', sizeMin: 0.40, sizeMax: 3.50 };
    }
    if (def.kind === 'prism') {
      return { hasHeight: true, sizeLabel: '底边长', sizeMin: 0.40, sizeMax: 7.00 };
    }
    return { hasHeight: true, sizeLabel: '底面半径', sizeMin: 0.30, sizeMax: 3.50 };
  }

  // 界面状态：立体类型 + 截面高度(世界坐标 y) + 截面欧拉角(度) + 显示开关
  var state = {
    solid: 'cone', sectionY: 1.6, rx: 0, ry: 0, rz: 0,
    show: { solid: true, plane: true, line: true, fill: true, clip: false },
    // 三视图里每个视图各自显示什么（在面板上的复选项里改）
    viewShow: {
      front: { outline: true, sec: true },
      side:  { outline: true, sec: true },
      top:   { outline: true, sec: true }
    },
    playing: false, playSpeed: 1
  };

  var container = document.getElementById('viewport');

  /* ==========================================================
   * 1. 渲染器 / 场景 / 相机
   * ========================================================== */

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.localClippingEnabled = true;   // "剖切实体" 用材质级裁剪平面
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a24);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  // ---- 灯光：一盏主光 + 一盏补光 + 天空光 ----
  scene.add(new THREE.HemisphereLight(0x9db4ff, 0x1a1a24, 0.40));

  var keyLight = new THREE.DirectionalLight(0xffffff, 0.80);
  keyLight.position.set(6, 9, 6);
  scene.add(keyLight);

  var fillLight = new THREE.DirectionalLight(0x6ea8ff, 0.30);
  fillLight.position.set(-7, 4, -6);
  scene.add(fillLight);

  // ---- 网格辅助线（落在 y = 0 平面，立体正好站在上面）----
  var grid = new THREE.GridHelper(16, 16, 0x3f3f58, 0x282838);
  grid.material.transparent = true;
  grid.material.opacity = 0.75;
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  scene.add(grid);

  /* ==========================================================
   * 1.5 参考坐标轴 OX / OY / OZ（机械制图的参考基准）
   * ========================================================== */

  var AXIS_COLOR = 0xc9a86a;

  function makeAxisLabel(text, size, color) {
    var px = 96;
    var cv = document.createElement('canvas');
    cv.width = cv.height = px;
    var g = cv.getContext('2d');
    g.font = 'bold 64px Consolas, "Microsoft YaHei", monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = color;
    g.fillText(text, px / 2, px / 2 + 4);

    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, depthTest: false, depthWrite: false
    }));
    sp.scale.set(size, size, 1);
    sp.renderOrder = 30;
    return sp;
  }

  function buildAxes() {
    var g = new THREE.Group();
    var mat = new THREE.LineBasicMaterial({ color: AXIS_COLOR, transparent: true, opacity: 0.9, depthWrite: false });

    var cfg = [
      // 轴名按机械制图：X = 长（水平）、Y = 宽（进深）、Z = 高（竖直）
      { dir: new THREE.Vector3(1, 0, 0), len: 3.0, name: 'Y' },
      { dir: new THREE.Vector3(0, 1, 0), len: 4.2, name: 'Z' },
      { dir: new THREE.Vector3(0, 0, 1), len: 3.0, name: 'X' }
    ];

    cfg.forEach(function (a) {
      var geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        a.dir.clone().multiplyScalar(a.len)
      ]);
      var line = new THREE.Line(geo, mat);
      line.renderOrder = 1;
      g.add(line);

      var lb = makeAxisLabel(a.name, 0.46, '#e3c48c');
      lb.position.copy(a.dir.clone().multiplyScalar(a.len + 0.26));
      g.add(lb);
    });

    var o = makeAxisLabel('O', 0.42, '#c9a86a');
    o.position.set(-0.26, 0.05, -0.26);
    g.add(o);

    return g;
  }

  scene.add(buildAxes());

  /* ==========================================================
   * 2. 截平面（半透明面片 + 边框），平面局部法线为 +Y
   * ========================================================== */

  var SECTION_SIZE = 4.8;
  var sectionGroup = new THREE.Group();
  scene.add(sectionGroup);

  // 截平面面片跟着立体尺寸走：立体做大/做高了，平面也要盖得住，
  // 否则平面只盖住物体下半截（缩小时才回到 4.8 左右的下限）
  function updatePlaneSize(def) {
    var need = 1.15 * Math.hypot(def.rBot * 2, def.h);
    var size = Math.max(4.0, Math.min(18, need));
    if (Math.abs(size - SECTION_SIZE) < 0.01) return;
    SECTION_SIZE = size;
    planeMesh.geometry.dispose();
    planeMesh.geometry = new THREE.PlaneGeometry(size, size);
    planeBorder.geometry.dispose();
    planeBorder.geometry = new THREE.EdgesGeometry(planeMesh.geometry);
  }

  var planeMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(SECTION_SIZE, SECTION_SIZE),
    new THREE.MeshBasicMaterial({
      color: 0xff5f8d,
      transparent: true,
      opacity: 0.075,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  planeMesh.rotation.x = -Math.PI / 2;   // PlaneGeometry 默认法线 +Z，转成 +Y
  planeMesh.renderOrder = 2;
  sectionGroup.add(planeMesh);

  var planeBorder = new THREE.LineSegments(
    new THREE.EdgesGeometry(planeMesh.geometry),
    new THREE.LineBasicMaterial({ color: 0xff8fb1, transparent: true, opacity: 0.55 })
  );
  planeBorder.rotation.x = -Math.PI / 2;
  planeBorder.renderOrder = 3;
  sectionGroup.add(planeBorder);

  /* ==========================================================
   * 3. 立体（网格 + 棱边线）
   * ========================================================== */

  // 立体用半透明表现：截交线就在体内，不透光就看不见（不再用 clippingPlanes 假装"切开"）
  var solidMat = new THREE.MeshStandardMaterial({
    color: 0x4a78d8,
    roughness: 0.46,
    metalness: 0.12,
    side: THREE.FrontSide,
    transparent: true,
    opacity: 0.30,
    depthWrite: false
  });
  var edgeMat = new THREE.LineBasicMaterial({
    color: 0x9dc0ff,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });

  var solid = null;   // { mesh, edges, height }

  // 由数学参数生成网格：顶点数与 rBot/rTop/h/sides 完全一致
  function makeGeometry(def) {
    if (def.kind === 'prism')    return new THREE.CylinderGeometry(def.rTop, def.rBot, def.h, def.sides);
    if (def.kind === 'cylinder') return new THREE.CylinderGeometry(def.rBot, def.rBot, def.h, 64);
    if (def.kind === 'cone')     return new THREE.ConeGeometry(def.rBot, def.h, 64);
    return new THREE.SphereGeometry(def.r, 48, 32);
  }

  // 让整个立体落在视野内所需的相机距离（按外接球 + 45° 视场估算，留一点余量）
  function fitDistanceFor(def) {
    var halfW = (def.kind === 'sphere' ? def.r : def.rBot);
    var halfH = def.h * 0.5;
    var rs = Math.sqrt(halfW * halfW * 2 + halfH * halfH);
    return 2.95 * rs;          // ≈ 1 / sin(22.5°) 再留 13% 余量
  }

  function buildSolid(key, keepView) {
    var def = SOLIDS[key];
    if (!def) return;

    if (solid) {
      scene.remove(solid.mesh);
      scene.remove(solid.edges);
      solid.mesh.geometry.dispose();
      solid.edges.geometry.dispose();
      solid = null;
    }

    applyDims(def);                                 // dims → rBot / rTop / h
    updatePlaneSize(def);                           // 截平面面片跟着立体大小走
    var geo = makeGeometry(def);
    geo.computeBoundingBox();
    geo.translate(0, -geo.boundingBox.min.y, 0);   // 底面贴到 y = 0
    geo.computeBoundingBox();
    var height = geo.boundingBox.max.y;

    solidMat.flatShading = !!def.flat;             // 棱柱/棱台要硬边着色
    solidMat.needsUpdate = true;

    var mesh = new THREE.Mesh(geo, solidMat);
    var edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 24), edgeMat);
    mesh.renderOrder = 0;
    edges.renderOrder = 1;
    scene.add(mesh);
    scene.add(edges);

    solid = { mesh: mesh, edges: edges, height: height };

    // 视角目标跟着立体高度；改尺寸时只挪纵向，不打断当前观察角度
    orbit.homeTargetY = height * 0.5;
    orbit.target.y = height * 0.5;
    if (!keepView) orbit.target.set(0, height * 0.5, 0);

    // 立体变大到装不下时才把相机推远（从不会自动拉近，免得打断用户缩放）
    var fit = fitDistanceFor(def);
    if (orbit.targetDist < fit) orbit.targetDist = Math.min(fit, orbit.maxDist);

    updateSection();
  }

  /* ==========================================================
   * 4. 截交线：解析求交（五类立体全覆盖）
   *    分派：圆柱 / 圆锥 → 射线法(4.1)　棱柱 / 棱台 → 棱线求交+极角排序(4.1b)
   *          球 → 球面与平面交圆(4.1c)
   * ----------------------------------------------------------
   * 圆柱 / 圆锥（射线法，不做三角网格遍历）：
   * 截面中心 P0 在立体轴线上（必在体内），
   * 五类立体都是关于轴线旋转对称的凸体，于是：
   *   取截平面的一组正交基 (U, V)，从 P0 沿 d(φ)=U·cosφ+V·sinφ 打射线，
   *   该方向的边界半径 r 是三条约束的交集：
   *     径向  圆柱：r²·|d_h|² ≤ R²                → r ≤ R/|d_h|
   *           圆锥：r²·|d_h|² ≤ (b + m·r)²        → r ≤ b/(|d_h| − m)
   *                 其中 b = R(1 − y0/H) 为该高度处的锥面半径
   *                      m = −R·d.y/H    为锥面半径沿射线的变化率
   *     下端面 y0 + r·d.y ≥ 0                    → r ≤ y0/(−d.y)
   *     上端面 y0 + r·d.y ≤ H                    → r ≤ (H−y0)/d.y
   * 取三者最小值即该方向的精确边界点，φ 均匀取样即得闭合折线；
   * 相邻方向主导约束切换处再用二分法补出精确转折点（曲面弧 ↔ 端面弦）。
   * 相切与水平截圆自动落在公式里：圆锥径向不等式的判别式恒为 4b²a ≥ 0，
   * 相切时径向解与端面解重合 → 折线退化，填充按面积判据跳过。
   * ========================================================== */

  var SECTION_SEGMENTS = 720;

  var _euler = new THREE.Euler();
  var _dir = new THREE.Vector3();
  var _n = new THREE.Vector3();
  var _U = new THREE.Vector3();
  var _V = new THREE.Vector3();

  var posVal = document.getElementById('pos-val');
  var rxVal = document.getElementById('rx-val');
  var ryVal = document.getElementById('ry-val');
  var rzVal = document.getElementById('rz-val');
  var sectionNote = document.getElementById('vp-note');

  // 写值输入框（正在输入的那个不覆盖，避免打断键入）
  function setChip(el, text) {
    if (document.activeElement !== el) el.value = text;
  }

  // 点是否在回转体"严格内部"（贴面的点不算：锚点落在边界上时射线会当场出界）
  var INSIDE_EPS = 1e-6;

  function insideSolid(def, p) {
    if (p.y <= INSIDE_EPS || p.y >= def.h - INSIDE_EPS) return false;
    var rho = Math.sqrt(p.x * p.x + p.z * p.z);
    if (def.kind === 'cylinder') return rho < def.rBot - INSIDE_EPS;
    if (def.kind === 'cone') return rho < def.rBot * (1 - p.y / def.h) - INSIDE_EPS;
    return false;
  }

  // 射线法以"平面内的锚点"为极点，锚点必须落在立体内部 —— 只有那时
  // 每个方向才恰有一个边界点（立体是凸体）。截面中心被滑块拖到立体之外时，
  // 就在这里另找一个截面内部的点：以外接球为界粗采样，取内部样本的形心
  // （凸集的形心仍在内部），再在附近细化一轮。
  function findInteriorAnchor(def, P0, U, V) {
    var half0 = Math.sqrt(def.rBot * def.rBot + def.h * def.h * 0.25) + 0.05;
    // 采样框中心取"轴线上最靠近该平面的那一点"的投影：平面被拖到立体上方/下方时，
    // 截面就长在那个端部附近，这样框才盖得住
    var yc = Math.min(Math.max(P0.y, INSIDE_EPS), def.h - INSIDE_EPS);
    var mid = new THREE.Vector3(0, yc, 0).sub(P0);
    var cu0 = mid.dot(U), cv0 = mid.dot(V);

    function centroid(cu, cv, half, n) {
      var sum = new THREE.Vector3(), cnt = 0, p = new THREE.Vector3();
      for (var i = 0; i <= n; i++) {
        for (var j = 0; j <= n; j++) {
          var u = cu - half + 2 * half * i / n;
          var v = cv - half + 2 * half * j / n;
          p.copy(P0).addScaledVector(U, u).addScaledVector(V, v);
          if (insideSolid(def, p)) { sum.add(p); cnt++; }
        }
      }
      return cnt ? sum.divideScalar(cnt) : null;
    }

    var c = centroid(cu0, cv0, half0, 40);
    if (!c) return null;
    var rel = new THREE.Vector3().subVectors(c, P0);
    return centroid(rel.dot(U), rel.dot(V), 2 * half0 / 40 * 1.2, 10) || c;
  }

  // 二次不等式 qa·r² + qb·r + qc ≤ 0 的最小正根；无正根返回 Infinity。
  // 锚点在体内 ⇒ qc ≤ 0 ⇒ 必有正根（qa>0）或整条射线都满足（qa<0 且 disc<0）。
  // 注意 qa<0 时开口向下，有效的 r 区间是 [0, 较小正根]，也必须取"最小"正根。
  function smallestPositiveRoot(qa, qb, qc) {
    if (Math.abs(qa) < 1e-12) {
      if (Math.abs(qb) < 1e-12) return Infinity;
      var rl = -qc / qb;
      return rl > 1e-9 ? rl : Infinity;
    }
    var disc = qb * qb - 4 * qa * qc;
    if (disc < 0) return Infinity;
    var sq = Math.sqrt(disc);
    var r1 = (-qb - sq) / (2 * qa);
    var r2 = (-qb + sq) / (2 * qa);
    var best = Infinity;
    if (r1 > 1e-9) best = Math.min(best, r1);
    if (r2 > 1e-9) best = Math.min(best, r2);
    return best;
  }

  // 单个方向上三条约束给出的半径（Infinity = 该约束不限制）
  // A 为平面内的锚点（必在体内），d 为单位方向
  function rayLimits(def, A, d) {
    var lim = { lat: Infinity, cap: Infinity };

    // 上下端面 y = 0 / y = H：两个交角里取"最小的正根"
    // （锚点可能在体内任何位置，不能按 d.y 的符号判断出口在哪一端面）
    if (Math.abs(d.y) > 1e-9) {
      var rTop = (def.h - A.y) / d.y;
      var rBot = (0 - A.y) / d.y;
      if (rTop > 1e-9) lim.cap = Math.min(lim.cap, rTop);
      if (rBot > 1e-9) lim.cap = Math.min(lim.cap, rBot);
    }

    // 径向（回转面）：|A_xz + r·d_xz|² ≤ R(y_A + r·d.y)²
    var a = d.x * d.x + d.z * d.z;
    var e = A.x * d.x + A.z * d.z;
    var f = A.x * A.x + A.z * A.z;

    if (def.kind === 'cylinder') {
      // a·r² + 2e·r + (f − R²) ≤ 0
      lim.lat = smallestPositiveRoot(a, 2 * e, f - def.rBot * def.rBot);
    } else if (def.kind === 'cone') {
      // (a − m²)r² + 2(e − b₀·m)r + (f − b₀²) ≤ 0，b₀ = R(1 − y_A/H)，m = −R·d.y/H
      var b0 = def.rBot * (1 - A.y / def.h);
      var m = -def.rBot * d.y / def.h;
      lim.lat = smallestPositiveRoot(a - m * m, 2 * (e - b0 * m), f - b0 * b0);
    }

    if (!(lim.lat > 1e-9)) lim.lat = Infinity;
    if (!(lim.cap > 1e-9)) lim.cap = Infinity;
    return lim;
  }

  // 该方向的边界点：半径 + 由哪条约束主导（用于找转折角）
  function boundaryAt(def, A, U, V, phi) {
    var c = Math.cos(phi), s = Math.sin(phi);
    _dir.set(U.x * c + V.x * s, U.y * c + V.y * s, U.z * c + V.z * s);
    var lim = rayLimits(def, A, _dir);
    var r = lim.lat, key = 'lat';
    if (lim.cap < r) { r = lim.cap; key = 'cap'; }
    return { r: r, key: key };
  }

  // 两条约束交换主导权的角度：对"两者之差"二分
  function refineSwitch(def, A, U, V, lo, hi, keyLo) {
    for (var k = 0; k < 44; k++) {
      var mid = (lo + hi) * 0.5;
      if (boundaryAt(def, A, U, V, mid).key === keyLo) lo = mid; else hi = mid;
    }
    return (lo + hi) * 0.5;
  }

  // 截交线点列（平面局部二维坐标：u 沿 U，v 沿 V；原点仍取截面中心 P0）
  function buildSectionPolygon(def, y0, U, V) {
    var P0 = new THREE.Vector3(0, y0, 0);
    var A = insideSolid(def, P0) ? P0 : findInteriorAnchor(def, P0, U, V);
    if (!A) return [];                        // 平面与立体确实不相交

    var off = new THREE.Vector3().subVectors(A, P0);
    var ou = off.dot(U), ov = off.dot(V);     // 锚点相对 P0 的平面内偏移

    var pts = [];
    var seg = SECTION_SEGMENTS;
    var prev = null;
    var firstKey = null;

    for (var i = 0; i < seg; i++) {
      var phi = i / seg * Math.PI * 2;
      var cur = boundaryAt(def, A, U, V, phi);

      if (!isFinite(cur.r) || cur.r <= 1e-9) { prev = null; continue; }
      if (prev === null) firstKey = cur.key;

      if (prev && prev.key !== cur.key) {
        var cp = refineSwitch(def, A, U, V, (i - 1) / seg * Math.PI * 2, phi, prev.key);
        var cr = boundaryAt(def, A, U, V, cp).r;
        if (isFinite(cr) && cr > 1e-9) {
          pts.push(new THREE.Vector2(ou + cr * Math.cos(cp), ov + cr * Math.sin(cp)));
        }
      }

      pts.push(new THREE.Vector2(ou + cur.r * Math.cos(phi), ov + cur.r * Math.sin(phi)));
      prev = cur;
    }

    // 收尾：最后一个采样方向与第一个之间也可能有转折
    if (prev && firstKey && prev.key !== firstKey && pts.length) {
      var lo = (seg - 1) / seg * Math.PI * 2;
      var cp2 = refineSwitch(def, A, U, V, lo, Math.PI * 2, prev.key);
      var cr2 = boundaryAt(def, A, U, V, cp2).r;
      if (isFinite(cr2) && cr2 > 1e-9) {
        pts.push(new THREE.Vector2(ou + cr2 * Math.cos(cp2), ov + cr2 * Math.sin(cp2)));
      }
    }

    return pts;
  }

  /* ---------- 4.1b 棱柱 / 棱台：棱线求交 + 极角排序 ----------
   * 正 n 棱柱 / 棱台是凸多面体，截交线必为凸多边形，顶点只可能落在
   * "与截平面异侧的棱"上，因此不需要取样：
   *   1) 遍历下底棱 / 上底棱 / 竖棱（棱台为斜棱），端点异侧 → 线性插值求交点；
   *   2) 顶点恰落在平面上时直接收取（退化点，交给去重处理）；
   *   3) 投到截平面二维基 (u, v) → 去重 → 按绕质心的极角 atan2 排序。
   * 凸多边形顶点集绕质心的极角序就是正确环序，排序后折线不会交叉。
   * 退化：平面只擦过一条棱或一个顶点 → 去重后不足 3 点，由上层判为退化；
   *       平面与某个侧面共面 → 只取该面边界棱上的交点，折线仍闭合。
   * 取角与 CylinderGeometry 一致（x = r·sinθ, z = r·cosθ），
   * 保证"算出来的点"落在"画出来的棱"上。
   * ---------------------------------------------------------- */

  var PRISM_EPS = 1e-7;    // 顶点"在平面上"的判定阈值
  var PRISM_DUP = 1e-6;    // 交点去重阈值

  function prismRings(def) {
    var n = def.sides;
    var bot = [], top = [];
    for (var i = 0; i < n; i++) {
      var th = i / n * Math.PI * 2;
      var s = Math.sin(th), c = Math.cos(th);
      bot.push(new THREE.Vector3(def.rBot * s, 0, def.rBot * c));
      top.push(new THREE.Vector3(def.rTop * s, def.h, def.rTop * c));
    }
    return { bot: bot, top: top };
  }

  function prismEdges(def) {
    var n = def.sides, edges = [];
    for (var i = 0; i < n; i++) {
      var j = (i + 1) % n;
      edges.push([i, j]);              // 下底棱
      edges.push([n + i, n + j]);      // 上底棱
      edges.push([i, n + i]);          // 竖棱（棱台为斜棱）
    }
    return edges;
  }

  function buildPrismSection(def, y0, U, V) {
    var nrm = new THREE.Vector3().crossVectors(V, U).normalize();
    var P0 = new THREE.Vector3(0, y0, 0);
    var rings = prismRings(def);
    var verts = rings.bot.concat(rings.top);
    var edges = prismEdges(def);

    // 各顶点到平面的有符号距离；|d| 小于阈值的一律归零，
    // 否则"平面正好包含某条棱"时两端点会拿到 ±1e-16 的噪声，插出一个假交点
    var d = [];
    for (var i = 0; i < verts.length; i++) {
      var di = nrm.dot(new THREE.Vector3().subVectors(verts[i], P0));
      d.push(Math.abs(di) < PRISM_EPS ? 0 : di);
    }

    var hits = [];

    // 1) 顶点恰在平面上
    for (var a = 0; a < verts.length; a++) {
      if (d[a] === 0) hits.push(verts[a].clone());
    }

    // 2) 端点异侧的棱 → 线性插值
    for (var k = 0; k < edges.length; k++) {
      var i1 = edges[k][0], i2 = edges[k][1];
      if (d[i1] * d[i2] < 0) {
        var t = d[i1] / (d[i1] - d[i2]);
        hits.push(verts[i1].clone().lerp(verts[i2], t));
      }
    }
    if (hits.length < 1) return [];

    // 3) 投影到平面局部基 (u, v) 并去重
    var P = [];
    for (var h = 0; h < hits.length; h++) {
      var rel = new THREE.Vector3().subVectors(hits[h], P0);
      var u = rel.dot(U), v = rel.dot(V);
      var dup = false;
      for (var q = 0; q < P.length; q++) {
        if (Math.abs(P[q].x - u) < PRISM_DUP && Math.abs(P[q].y - v) < PRISM_DUP) { dup = true; break; }
      }
      if (!dup) P.push(new THREE.Vector2(u, v));
    }
    if (P.length < 3) return P;

    // 4) 绕质心的极角排序（凸多边形 → 即正确环序）
    var cx = 0, cy = 0;
    for (var m = 0; m < P.length; m++) { cx += P[m].x; cy += P[m].y; }
    cx /= P.length; cy /= P.length;

    P.sort(function (p1, p2) {
      return Math.atan2(p1.y - cy, p1.x - cx) - Math.atan2(p2.y - cy, p2.x - cx);
    });

    return P;
  }

  /* ---------- 4.1c 球：球面与平面的交（圆） ----------
   * 球心 C 到截平面的距离 d → 截面圆半径 r = √(R² − d²)，
   * 截面圆心 = C 在平面上的投影。d ≥ R 即相切/不相交 → 返回空。
   * ---------------------------------------------------------- */

  function buildSphereSection(def, y0, U, V) {
    var nrm = new THREE.Vector3().crossVectors(V, U).normalize();
    var P0 = new THREE.Vector3(0, y0, 0);
    var C = new THREE.Vector3(0, def.r, 0);        // 球心（球底贴在 y = 0）
    var Rr = def.r;

    var d = nrm.dot(new THREE.Vector3().subVectors(C, P0));
    var dist = Math.min(Math.abs(d), Rr);
    var r = Math.sqrt(Math.max(Rr * Rr - dist * dist, 0));
    if (r < 1e-6) return [];                        // 相切 → 退化

    // 截面圆心（球心在平面上的投影）→ 平面局部坐标
    var Cc = C.clone().addScaledVector(nrm, -d);
    var rel = new THREE.Vector3().subVectors(Cc, P0);
    var cu = rel.dot(U), cv = rel.dot(V);

    var N = 240, pts = [];
    for (var i = 0; i < N; i++) {
      var a = i / N * Math.PI * 2;
      pts.push(new THREE.Vector2(cu + r * Math.cos(a), cv + r * Math.sin(a)));
    }
    return pts;
  }

  /* ---------- 4.2 截交线 + 截面填充的渲染 ---------- */

  var LINE_GREEN = 0x2ee87f;
  // 截交线用"细管"而不是 Line：WebGL 的 linewidth 在多数平台被忽略（恒为 1px），
  // 想让它比轮廓线略粗只能给真实几何厚度
  var lineMat = new THREE.MeshBasicMaterial({ color: LINE_GREEN, depthWrite: false });
  var fillMat = new THREE.MeshBasicMaterial({
    color: 0xff2d4f,
    transparent: true,
    opacity: 0.26,
    side: THREE.DoubleSide,
    depthWrite: false,
    polygonOffset: true,          // 与截平面共面：靠深度偏移避免闪烁
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2
  });

  var sectionLine = null;   // THREE.LineLoop
  var sectionFill = null;   // THREE.Mesh(ShapeGeometry)
  var currentSection3D = [];  // 截交线的世界坐标点列（给三视图投影用）
  var currentCurveInfo = null; // 截交线是什么曲线（解析判定，给三视图标注用）
  var currentPlaneNormal = null; // 当前截平面法向（判断某视图里是否投影成直线）

  function clearSectionObjects() {
    if (sectionLine) {
      sectionGroup.remove(sectionLine);
      sectionLine.geometry.dispose();
      sectionLine = null;
    }
    if (sectionFill) {
      sectionGroup.remove(sectionFill);
      sectionFill.geometry.dispose();
      sectionFill = null;
    }
  }

  // 显示开关：把 state.show 落到场景对象上（切立体 / 重建交线后都要再刷一次）
  function applyDisplayOptions() {
    if (solid) {
      solid.mesh.visible = state.show.solid;
      solid.edges.visible = state.show.solid;
    }
    planeMesh.visible = state.show.plane;
    planeBorder.visible = state.show.plane;
    if (sectionLine) sectionLine.visible = state.show.line;
    if (sectionFill) sectionFill.visible = state.show.fill;

    // 剖切：沿截平面把"法向那一侧"的实体切掉，露出截面
    //   three.js 丢弃 plane.distanceToPoint(p) < 0 的像素，
    //   所以法向取反、常数取 n·P0，正好丢掉 n·(p−P0) > 0 的一半
    var clips = null;
    if (state.show.clip && currentPlaneNormal) {
      var p0 = new THREE.Vector3(0, state.sectionY, 0);
      clips = [new THREE.Plane(currentPlaneNormal.clone().negate(), currentPlaneNormal.dot(p0))];
    }
    solidMat.clippingPlanes = clips;
    solidMat.needsUpdate = true;
    edgeMat.clippingPlanes = clips;
    edgeMat.needsUpdate = true;
  }

  function drawSectionFill(pts) {
    var shape = new THREE.Shape();
    shape.moveTo(pts[0].x, pts[0].y);
    for (var j = 1; j < pts.length; j++) shape.lineTo(pts[j].x, pts[j].y);
    shape.closePath();

    sectionFill = new THREE.Mesh(new THREE.ShapeGeometry(shape), fillMat);
    // 约定：点列 (u, v) → 局部 (u, 0, +v)，与射线方向 U·cosφ+V·sinφ 一致
    sectionFill.rotation.x = Math.PI / 2;
    sectionFill.renderOrder = 4;
    sectionGroup.add(sectionFill);
  }

  function drawSectionLine(pts) {
    if (!pts || pts.length < 2) return;

    // 沿折线放一根细管：拐角仍是尖的（用折线段而不是样条）
    var path = [];
    for (var k = 0; k < pts.length; k++) path.push(new THREE.Vector3(pts[k].x, 0, pts[k].y));

    var closedLoop = pts.length > 2;
    var curve = new THREE.CurvePath();
    for (var j = 0; j < path.length - 1; j++) {
      curve.add(new THREE.LineCurve3(path[j], path[j + 1]));
    }

    var radius = Math.max(0.005, SECTION_SIZE * 0.0018);
    var segs = Math.min(480, Math.max(32, path.length * 2));
    var geo = new THREE.TubeGeometry(curve, segs, radius, 6, closedLoop);

    sectionLine = new THREE.Mesh(geo, lineMat);
    sectionLine.renderOrder = 6;
    sectionGroup.add(sectionLine);
  }

  /* 按立体类型分派求解器，返回状态：'ok' / 'degenerate' / 'empty' */
  function rebuildSection(def, y0, U, V) {    clearSectionObjects();
    currentSection3D = [];
    if (!def) return 'empty';

    var pts;
    if (def.kind === 'sphere')      pts = buildSphereSection(def, y0, U, V);
    else if (def.kind === 'prism')  pts = buildPrismSection(def, y0, U, V);
    else                            pts = buildSectionPolygon(def, y0, U, V);   // 圆柱 / 圆锥

    if (!pts || pts.length === 0) return 'empty';

    // 存一份世界坐标，供三视图投影用
    var P0 = new THREE.Vector3(0, y0, 0);
    currentSection3D = pts.map(function (p) {
      return P0.clone().addScaledVector(U, p.x).addScaledVector(V, p.y);
    });

    // 交线照画（退化时它就是一个点/一段线，本身也是信息）
    drawSectionLine(pts);
    if (pts.length < 3) return 'degenerate';

    // 面积判据：相切 / 退化时不出面片
    var area2 = 0;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      area2 += p.x * q.y - q.x * p.y;
    }
    if (Math.abs(area2) <= 1e-6) return 'degenerate';

    drawSectionFill(pts);
    return 'ok';
  }

  /* ---------- 4.3 参数 -> 场景 的联动 ---------- */

  /* 截交线是什么曲线（三维空间里的曲线）：按"立体类型 + 截平面姿态"解析判定
   *   棱柱/棱台/棱锥 → 一次（多边形，全由直线段组成）
   *   圆柱 → 圆（⊥轴）/ 两条平行直线（∥轴）/ 椭圆
   *   圆锥 → 圆（⊥轴）/ 两条相交直线（过锥顶）/ 椭圆 / 抛物线 / 双曲线
   *          由"平面与轴线的夹角 θ" 与"半顶角 α" 比较决定：θ>α 椭圆、θ=α 抛物线、θ<α 双曲线
   *   球   → 恒为圆
   * 曲线被底面 / 顶面切掉一块时标"部分"
   * kind3d 供各视图判定投影后的形状用（见 viewCurveLabel）
   */
  function classifySection(def, nrm, y0, pts) {
    if (!pts || pts.length < 3) return null;
    var ny = Math.abs(nrm.y);

    // 截交线碰到端面 → 只为"一部分"（棱类多边形本身闭合，不算部分）
    var truncated = false;
    for (var i = 0; i < pts.length; i++) {
      if (Math.abs(pts[i].y) < 2e-3 || Math.abs(pts[i].y - def.h) < 2e-3) { truncated = true; break; }
    }

    if (def.kind === 'sphere') return { text: '圆', partial: false, kind3d: 'circle' };

    if (def.kind === 'prism') {
      var names = { 3: '三角形', 4: '四边形', 5: '五边形', 6: '六边形',
                    7: '七边形', 8: '八边形', 9: '九边形', 10: '十边形' };
      return { text: names[pts.length] || (pts.length + ' 边形'), partial: false, kind3d: 'polygon' };
    }

    if (def.kind === 'cylinder') {
      if (ny > 0.9995) return { text: '圆', partial: false, kind3d: 'circle' };            // 垂直轴线
      if (ny < 0.0005) return { text: '两条平行直线', partial: false, kind3d: 'lines' };    // 平行轴线（矩形）
      return { text: '椭圆', partial: truncated, kind3d: 'ellipse' };
    }

    // 圆锥
    var apex = new THREE.Vector3(0, def.h, 0);
    var apexDist = Math.abs(nrm.dot(new THREE.Vector3(0, y0, 0).sub(apex)));
    if (apexDist < 1e-3) return { text: '两条相交直线', partial: false, kind3d: 'lines' };  // 过锥顶
    if (ny > 0.9995) return { text: '圆', partial: false, kind3d: 'circle' };               // 垂直轴线

    var theta = Math.asin(Math.min(1, ny)) * 180 / Math.PI;   // 平面与轴线夹角
    var alpha = Math.atan(def.rBot / def.h) * 180 / Math.PI;  // 半顶角
    if (theta > alpha + 0.4) return { text: '椭圆', partial: truncated, kind3d: 'ellipse' };
    if (theta >= alpha - 0.4) return { text: '抛物线', partial: truncated, kind3d: 'parabola' };
    return { text: '双曲线', partial: truncated, kind3d: 'hyperbola' };
  }

  /* ---------- 各视图里"看到的是什么曲线" ----------
   * 三视图要反映看到的样子，所以按投影后的点判定，而不是直接抄三维曲线名：
   *   1) 视线方向落在截平面内 → 投影成一条直线
   *   2) 棱类 → 多边形（顶点数不变）
   *   3) 二次曲线 → 对投影点做圆拟合：确实是圆就写"圆"，否则回到三维类型
   *      （仿射投影保二次曲线类型；只有"椭圆 ↔ 圆"这两种同一类型内的差别需要现场判定。
   *        圆柱斜切后截交线全在圆柱面上，俯视必然是那个圆；球斜切在侧视是椭圆。）
   */
  function solve3(A, b) {
    // 3×3 高斯消元（带部分主元）
    var m = [[A[0][0], A[0][1], A[0][2], b[0]],
             [A[1][0], A[1][1], A[1][2], b[1]],
             [A[2][0], A[2][1], A[2][2], b[2]]];
    for (var col = 0; col < 3; col++) {
      var piv = col;
      for (var r = col + 1; r < 3; r++) if (Math.abs(m[r][col]) > Math.abs(m[piv][col])) piv = r;
      if (Math.abs(m[piv][col]) < 1e-12) return null;
      var tmp = m[col]; m[col] = m[piv]; m[piv] = tmp;
      for (var r2 = 0; r2 < 3; r2++) {
        if (r2 === col) continue;
        var f = m[r2][col] / m[col][col];
        for (var k = col; k < 4; k++) m[r2][k] -= f * m[col][k];
      }
    }
    return [m[0][3] / m[0][0], m[1][3] / m[1][1], m[2][3] / m[2][2]];
  }

  // 投影点是圆吗（最小二乘圆拟合 + 相对残差判据）
  function isCircle2D(pts) {
    var n = pts.length;
    if (n < 8) return false;

    var cx = 0, cy = 0, i;
    for (i = 0; i < n; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    cx /= n; cy /= n;

    var scale = 0;
    for (i = 0; i < n; i++) {
      var dx = pts[i][0] - cx, dy = pts[i][1] - cy;
      scale += dx * dx + dy * dy;
    }
    scale = Math.sqrt(scale / n);
    if (!(scale > 1e-9)) return false;

    // 归一化后解 u²+v²+D·u+E·v+F=0 的最小二乘正规方程
    var A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], b = [0, 0, 0];
    for (i = 0; i < n; i++) {
      var u = (pts[i][0] - cx) / scale, v = (pts[i][1] - cy) / scale;
      var row = [u, v, 1], rr = -(u * u + v * v);
      for (var a = 0; a < 3; a++) {
        b[a] += row[a] * rr;
        for (var c = 0; c < 3; c++) A[a][c] += row[a] * row[c];
      }
    }
    var sol = solve3(A, b);
    if (!sol) return false;

    var R2 = sol[0] * sol[0] / 4 + sol[1] * sol[1] / 4 - sol[2];
    if (!(R2 > 0)) return false;
    var R = Math.sqrt(R2), ox = -sol[0] / 2, oy = -sol[1] / 2;

    var maxDev = 0;
    for (i = 0; i < n; i++) {
      var u2 = (pts[i][0] - cx) / scale, v2 = (pts[i][1] - cy) / scale;
      maxDev = Math.max(maxDev, Math.abs(Math.hypot(u2 - ox, v2 - oy) - R));
    }
    return maxDev / R < 2e-3;      // 0.2% 以内算圆
  }

  // 某个视图里"看到"的截交线是什么
  function viewCurveLabel(view, def) {
    if (!currentCurveInfo || !currentPlaneNormal) return '';
    var info = currentCurveInfo;

    // 视线方向落在截平面内 → 截交线在该视图投影成一条直线
    if (Math.abs(currentPlaneNormal.dot(VIEW_DIR[view])) < 5e-4) return '直线';
    if (info.kind3d === 'polygon' || info.kind3d === 'lines') return info.text;

    // 二次曲线：把投影点集做圆拟合，确实是圆就写"圆"
    function project(list, skipEnds) {
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        // 被端面切出来的那条弦不属于曲线本身，先剔掉，圆拟合才准
        if (skipEnds && (Math.abs(p.y) < 2e-3 || Math.abs(p.y - def.h) < 2e-3)) continue;
        if (view === 'front')      out.push([-p.z, p.y]);
        else if (view === 'side')  out.push([p.x, p.y]);
        else                       out.push([-p.z, p.x]);
      }
      return out;
    }

    var pts = project(currentSection3D, true);
    if (pts.length < 8) pts = project(currentSection3D, false);

    var suffix = info.partial ? '（部分）' : '';
    if (isCircle2D(pts)) return '圆' + suffix;
    var name = (info.kind3d === 'circle' || info.kind3d === 'ellipse') ? '椭圆' : info.text;
    return name + suffix;
  }

  function updateSection() {
    if (!solid) return;

    var deg = THREE.MathUtils.degToRad;
    _euler.set(deg(state.rx), deg(state.ry), deg(state.rz), 'XYZ');

    // 截面中心落在轴线上的给定高度（世界坐标，滑块 -2.00 ~ 4.00）
    var h = state.sectionY;
    sectionGroup.position.set(0, h, 0);
    sectionGroup.rotation.copy(_euler);

    // 截平面的局部基：sectionGroup 局部 X / Z 轴旋转到世界后的方向
    _U.set(1, 0, 0).applyEuler(_euler);
    _V.set(0, 0, 1).applyEuler(_euler);

    // 水平面正好压到底面 / 顶面：只贴着端面、没有切进去 → 按"不相交"处理
    _n.set(0, 1, 0).applyEuler(_euler);
    var faceOnly = Math.abs(Math.abs(_n.y) - 1) < 1e-6 &&
                   (Math.abs(h) < 1e-6 || Math.abs(h - solid.height) < 1e-6);

    var status = faceOnly ? 'empty' : rebuildSection(SOLIDS[state.solid], h, _U, _V);

    // 截交线类型（给三视图每个视图下面标注）
    currentPlaneNormal = _n.clone();
    currentCurveInfo = (status === 'empty')
      ? null
      : classifySection(SOLIDS[state.solid], _n, h, currentSection3D);

    if (sectionNote) {
      if (status === 'ok') {
        sectionNote.hidden = true;
      } else {
        sectionNote.textContent = (status === 'empty')
          ? '截面与立体不相交'
          : '截面退化（相切 / 面积为零）';
        sectionNote.hidden = false;
      }
    }

    // 数值回显
    setChip(posVal, h.toFixed(2));
    setChip(rxVal, Math.round(state.rx) + '°');
    setChip(ryVal, Math.round(state.ry) + '°');
    setChip(rzVal, Math.round(state.rz) + '°');

    applyDisplayOptions();
    drawViews(SOLIDS[state.solid]);
    markPlanePreset();
  }

  /* ==========================================================
   * 4.4 三视图（右上角 2D 画布重绘）
   * ----------------------------------------------------------
   * 轴名按机械制图习惯：X = 长（水平）、Y = 宽（进深）、Z = 高
   *   主视图 = X×Z    左视图 = Y×Z    俯视图 = X×Y
   *   长对正：主视图与俯视图共用横坐标（都取世界 z）
   *   高平齐：主视图与左视图共用纵坐标（都取世界 y）
   *   宽相等：左视图与俯视图共用"宽"的量（都取世界 x，即 Y 向进深）
   * 可见性：九类立体都是凸体 —— 某点只要有"相邻面朝观察者"（n·d>0），
   *        或正处于轮廓上（各面都贴视线，n·d≈0），就算可见；否则画虚线。
   * 蓝线 = 立体轮廓，绿线 = 截交线（略粗）
   * 每个视图下面标出该视图里截交线是什么曲线（见 classifySection）
   * ========================================================== */

  var VIEWS_W = 300, VIEWS_H = 292;
  var viewsCanvas = document.getElementById('views-canvas');
  var viewsCtx = viewsCanvas ? viewsCanvas.getContext('2d') : null;

  var VIEW_FRONT = { x: 66, y: 76 };
  var VIEW_SIDE = { x: 234, y: 76 };
  var VIEW_TOP = { x: 66, y: 220 };

  var LINE_BLUE = '#5f8fd6';
  var LINE_SEC = '#ff2d4f';    // 三视图里的截交线：维持最初的红色（3D 里是绿色）

  // 三个视向（单位向量，指向观察者）
  var VIEW_DIR = {
    front: new THREE.Vector3(1, 0, 0),
    side: new THREE.Vector3(0, 0, 1),
    top: new THREE.Vector3(0, 1, 0)
  };

  var VIEW_ZOOM = 1;              // 面板缩放（拖动右下角手柄改变）

  function applyViewCanvasSize() {
    if (!viewsCtx) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(VIEWS_W * VIEW_ZOOM);
    var h = Math.round(VIEWS_H * VIEW_ZOOM);
    viewsCanvas.width = Math.round(w * dpr);
    viewsCanvas.height = Math.round(h * dpr);
    viewsCanvas.style.width = w + 'px';
    viewsCanvas.style.height = h + 'px';
  }

  // 三个视图共用一个比例，才能"长对正 / 高平齐"
  function viewScale(def) {
    var half = (def.kind === 'sphere' ? def.r : def.rBot) + 0.06;
    return Math.min(100 / (2 * half), 100 / (def.h + 0.12));
  }

  /* ---- 可见性：从该点朝观察者走一小步，若落进实体内部 ⇒ 被遮挡 ---- */

  function insideSolid3D(def, p) {
    if (p.y < -1e-9 || p.y > def.h + 1e-9) return false;
    var rho = Math.sqrt(p.x * p.x + p.z * p.z);

    if (def.kind === 'cylinder') return rho < def.rBot - 1e-9;
    if (def.kind === 'cone') return rho < def.rBot * (1 - p.y / def.h) - 1e-9;
    if (def.kind === 'sphere') {
      var dy = p.y - def.r;
      return Math.sqrt(p.x * p.x + dy * dy + p.z * p.z) < def.r - 1e-9;
    }
    if (def.kind === 'prism') {
      var r = def.rBot + (def.rTop - def.rBot) * (p.y / def.h);
      var inr = r * Math.cos(Math.PI / def.sides);
      for (var k = 0; k < def.sides; k++) {
        var a = (k + 0.5) / def.sides * Math.PI * 2;
        // 严格内部：正好落在侧面上的点不算"内部"（否则轮廓会被判成被遮挡）
        if (p.x * Math.sin(a) + p.z * Math.cos(a) >= inr - 1e-9) return false;
      }
      return true;
    }
    return false;
  }

  // 凸体：从边界点朝观察者走 eps，进到实体里说明这点在"背面" → 不可见
  function isVisibleAt(def, p, d) {
    var eps = 2e-3;
    return !insideSolid3D(def, {
      x: p.x + d.x * eps,
      y: p.y + d.y * eps,
      z: p.z + d.z * eps
    });
  }

  function ring3D(y, r, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = i / n * Math.PI * 2;
      pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)));
    }
    return pts;
  }

  // 该立体在该视向上的轮廓线（3D 折线）
  function viewLines(def, view) {
    var out = [];
    var H = def.h;

    if (def.kind === 'prism') {
      var n = def.sides;
      [0, 1].forEach(function (row) {
        var y = row === 0 ? 0 : H;
        var r = row === 0 ? def.rBot : def.rTop;
        var pts = [];
        for (var i = 0; i <= n; i++) {
          var th = (i % n) / n * Math.PI * 2;
          pts.push(new THREE.Vector3(r * Math.sin(th), y, r * Math.cos(th)));
        }
        out.push(pts);
      });
      for (var k = 0; k < n; k++) {
        var t = k / n * Math.PI * 2;
        out.push([
          new THREE.Vector3(def.rBot * Math.sin(t), 0, def.rBot * Math.cos(t)),
          new THREE.Vector3(def.rTop * Math.sin(t), H, def.rTop * Math.cos(t))
        ]);
      }
    } else if (def.kind === 'cylinder' || def.kind === 'cone') {
      out.push(ring3D(0, def.rBot, 64));
      if (def.kind === 'cylinder') out.push(ring3D(H, def.rBot, 64));
      // 当前视向的轮廓母线：与视线垂直的水平方向（俯视图退化，跳过）
      var perp = view === 'front' ? new THREE.Vector3(0, 0, 1)
               : view === 'side' ? new THREE.Vector3(1, 0, 0) : null;
      if (perp) {
        [1, -1].forEach(function (sg) {
          out.push([
            new THREE.Vector3(perp.x * sg * def.rBot, 0, perp.z * sg * def.rBot),
            new THREE.Vector3(perp.x * sg * def.rTop, H, perp.z * sg * def.rTop)
          ]);
        });
      }
    } else if (def.kind === 'sphere') {
      var R = def.r, cy = R, pts2 = [];
      for (var i2 = 0; i2 <= 64; i2++) {
        var a2 = i2 / 64 * Math.PI * 2;
        if (view === 'front') pts2.push(new THREE.Vector3(0, cy + R * Math.sin(a2), R * Math.cos(a2)));
        else if (view === 'side') pts2.push(new THREE.Vector3(R * Math.cos(a2), cy + R * Math.sin(a2), 0));
        else pts2.push(new THREE.Vector3(R * Math.cos(a2), cy, R * Math.sin(a2)));
      }
      out.push(pts2);
    }
    return out;
  }

  function strokeProjected(ctx, pts3, to2D) {
    if (!pts3 || pts3.length < 2) return;
    var p0 = to2D(pts3[0]);
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    for (var i = 1; i < pts3.length; i++) {
      var p = to2D(pts3[i]);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
  }

  // 把一条曲线按可见性切成若干段（相邻同状态合并）
  // 判可见性用"线段起点"而不是弦中点：曲线是取在表面上的点连成的折线，
  // 顶点在表面上，而弦中点对圆弧来说会落到实体内部（会误判成被遮挡）
  function collectRuns(def, pts3, d, style, out) {
    if (!pts3 || pts3.length < 2) return;
    var cur = null;
    for (var i = 0; i < pts3.length - 1; i++) {
      var a = pts3[i], b = pts3[i + 1];
      var vis = isVisibleAt(def, a, d);
      if (!cur || cur.vis !== vis) {
        cur = { vis: vis, pts: [a], style: style };
        out.push(cur);
      }
      cur.pts.push(b);
    }
  }

  // 统一绘制：先整批画不可见（虚线），再整批画可见（实线压在上面），
  // 这样"隐藏线"永远不会盖住同视图里更靠前的可见线
  function strokeRuns(ctx, runs, to2D, wantVisible) {
    for (var i = 0; i < runs.length; i++) {
      var r = runs[i];
      if (r.vis !== wantVisible) continue;
      ctx.strokeStyle = r.style.color;
      ctx.lineWidth = r.style.width;
      ctx.setLineDash(wantVisible ? [] : r.style.dash);
      strokeProjected(ctx, r.pts, to2D);
    }
    ctx.setLineDash([]);
  }

  function drawViews(def) {
    if (!viewsCtx) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2) * VIEW_ZOOM;
    var ctx = viewsCtx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, VIEWS_W, VIEWS_H);
    if (!def) return;

    var s = viewScale(def);
    var midY = def.h / 2;

    // 主视图：横 = 世界 z（X 长），纵 = 世界 y（Z 高）
    // 左视图：横 = 世界 x（Y 宽），纵 = 世界 y（Z 高）
    // 俯视图：横 = 世界 z（X 长），纵 = 世界 x（Y 宽）
    function makeProjector(view) {
      if (view === 'front') {
        return function (p) { return [VIEW_FRONT.x - p.z * s, VIEW_FRONT.y - (p.y - midY) * s]; };
      }
      if (view === 'side') {
        return function (p) { return [VIEW_SIDE.x + p.x * s, VIEW_FRONT.y - (p.y - midY) * s]; };
      }
      return function (p) { return [VIEW_TOP.x - p.z * s, VIEW_TOP.y + p.x * s]; };
    }

    // 视图标题 + 轴名提示
    ctx.font = '10px "Microsoft YaHei", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#8b93b8';
    ctx.fillText('主视图', 8, 6);
    ctx.fillText('左视图', 176, 6);
    ctx.fillText('俯视图', 8, 152);
    ctx.fillStyle = '#5b6280';
    ctx.fillText('X·Z', 50, 6);
    ctx.fillText('Y·Z', 218, 6);
    ctx.fillText('X·Y', 50, 152);
    ctx.fillText('第一角画法', 176, 156);
    ctx.fillText('长对正 · 高平齐 · 宽相等', 176, 170);
    ctx.fillText('虚线 = 不可见', 176, 184);

    // 每个视图下面写"这里看到的截交线是什么"（按投影后的形状判定，见 viewCurveLabel）
    // 该视图关掉了截交线就不写（没有线可标）
    if (currentCurveInfo && currentPlaneNormal) {
      ctx.font = '9.5px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e08aa8';
      [['front', VIEW_FRONT], ['side', VIEW_SIDE], ['top', VIEW_TOP]].forEach(function (pair) {
        var vs = state.viewShow[pair[0]];
        if (!vs || !vs.sec) return;
        var y = (pair[0] === 'top') ? 274 : 130;
        ctx.fillText(viewCurveLabel(pair[0], def), pair[1].x, y);
      });
      ctx.textAlign = 'left';
    }

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 截交线抽稀到 ~140 点（投影画布足够）
    var sectionPts = null;
    if (currentSection3D.length > 2) {
      var step = Math.max(1, Math.round(currentSection3D.length / 140));
      sectionPts = [];
      for (var i = 0; i < currentSection3D.length; i += step) sectionPts.push(currentSection3D[i]);
      sectionPts.push(currentSection3D[0]);        // 闭合
    }

    var STYLE_BLUE = { color: LINE_BLUE, width: 1, dash: [3, 3] };
    var STYLE_SEC = { color: LINE_SEC, width: 2.1, dash: [4, 3] };

    ['front', 'side', 'top'].forEach(function (view) {
      var proj = makeProjector(view);
      var d = VIEW_DIR[view];
      var vs = state.viewShow[view] || { outline: true, sec: true };
      var runs = [];

      // 总开关（显示选项）控制全部视图；这里的开关只管这一个视图
      if (state.show.solid && vs.outline) {
        viewLines(def, view).forEach(function (pts) { collectRuns(def, pts, d, STYLE_BLUE, runs); });
      }
      if (state.show.line && vs.sec && sectionPts) {
        collectRuns(def, sectionPts, d, STYLE_SEC, runs);
      }

      strokeRuns(ctx, runs, proj, false);   // 虚线
      strokeRuns(ctx, runs, proj, true);    // 实线
    });
  }

  applyViewCanvasSize();

  /* ---- 三视图面板收起 / 展开（不做动画，直接显示/隐藏）---- */
  (function setupViewsCollapse() {

  /* ---- 三视图面板拖拽缩放（像在 Word 里拖图片角点；双击复位）---- */
  (function setupViewsResize() {
    var grip = document.getElementById('views-grip');
    if (!grip) return;

    var drag = null;

    function clampZoom(z) {
      var maxW = (container.clientWidth - 90) / VIEWS_W;
      var maxH = (container.clientHeight - 90) / VIEWS_H;
      var maxZ = Math.min(2.6, Math.max(0.9, Math.min(maxW, maxH)));
      return Math.max(0.75, Math.min(maxZ, z));
    }

    grip.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, start: VIEW_ZOOM };
      try { grip.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件无捕获权也无妨 */ }
    });

    grip.addEventListener('pointermove', function (e) {
      if (!drag) return;
      // 手柄在左下角：往左拖、往下拖都是放大
      var d = ((drag.x - e.clientX) + (e.clientY - drag.y)) / 2;
      VIEW_ZOOM = clampZoom(drag.start * (1 + d / 240));
      applyViewCanvasSize();
      drawViews(SOLIDS[state.solid]);
    });

    function end(e) {
      if (!drag) return;
      drag = null;
      try {
        if (e && grip.hasPointerCapture && grip.hasPointerCapture(e.pointerId)) {
          grip.releasePointerCapture(e.pointerId);
        }
      } catch (err) { /* ignore */ }
    }
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);

    grip.addEventListener('dblclick', function () {
      VIEW_ZOOM = 1;
      applyViewCanvasSize();
      drawViews(SOLIDS[state.solid]);
    });
  })();

  /* ==========================================================
   * 5. 简易 OrbitControls
   *    球坐标(方位角 theta / 极角 phi) + 观察距离 dist + 注视点 target
   *    鼠标拖动改变目标值，渲染循环里做阻尼插值，手感接近 OrbitControls
   * ========================================================== */

  var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };

  // 默认视角（"重置视角"按钮回到这里）
  var HOME = { theta: 0.72, phi: 1.12, dist: 8.4 };

  var orbit = {
    theta: HOME.theta, targetTheta: HOME.theta,
    phi: HOME.phi,     targetPhi: HOME.phi,
    dist: HOME.dist,   targetDist: HOME.dist,
    minDist: 3.5, maxDist: 24,
    // 允许拖到接近正上方 / 正下方：留 0.01 rad（≈0.6°）只是为了避免
    // lookAt 在"视线与 up 平行"时退化，肉眼就是完全俯视/仰视
    minPhi: 0.01, maxPhi: Math.PI - 0.01,
    target: new THREE.Vector3(0, 1.6, 0),
    homeTargetY: 1.6
  };

  var canvas = renderer.domElement;
  var drag = null;   // { mode: 'rotate' | 'pan', x, y }

  canvas.style.cursor = 'grab';
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('pointerdown', function (e) {
    drag = {
      mode: (e.button === 2 || e.button === 1 || e.shiftKey) ? 'pan' : 'rotate',
      x: e.clientX,
      y: e.clientY
    };
    canvas.style.cursor = drag.mode === 'pan' ? 'move' : 'grabbing';
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;

    if (drag.mode === 'rotate') {
      orbit.targetTheta -= dx * 0.007;
      orbit.targetPhi = clamp(orbit.targetPhi - dy * 0.007, orbit.minPhi, orbit.maxPhi);
    } else {
      // 沿相机自身的右方向 / 上方向平移注视点
      var dir = new THREE.Vector3().subVectors(orbit.target, camera.position).normalize();
      var right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
      var up = new THREE.Vector3().crossVectors(right, dir).normalize();
      var k = orbit.dist * 0.0018;
      orbit.target.addScaledVector(right, -dx * k);
      orbit.target.addScaledVector(up, dy * k);
    }
  });

  function endDrag(e) {
    if (!drag) return;
    drag = null;
    canvas.style.cursor = 'grab';
    if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    orbit.targetDist = clamp(orbit.targetDist * Math.exp(e.deltaY * 0.0015), orbit.minDist, orbit.maxDist);
  }, { passive: false });

  // 每帧：阻尼 + 由球坐标算出相机位置
  function updateCamera() {
    orbit.theta += (orbit.targetTheta - orbit.theta) * 0.18;
    orbit.phi += (orbit.targetPhi - orbit.phi) * 0.18;
    orbit.dist += (orbit.targetDist - orbit.dist) * 0.18;

    var sp = Math.sin(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.dist * sp * Math.sin(orbit.theta),
      orbit.target.y + orbit.dist * Math.cos(orbit.phi),
      orbit.target.z + orbit.dist * sp * Math.cos(orbit.theta)
    );
    camera.lookAt(orbit.target);
  }

  /* ---- 值输入框：滑条粗调，框里敲精确值 ----
   * 回车 / 失焦时校验：
   *   空 或 非数字      → 提示"请输入数字"，不清掉用户敲的内容（回车）/ 失焦则回退
   *   超出滑条范围      → 提示"超出范围（min ~ max），请重新输入"
   *   合法              → 按滑条步长吸附后写回，滑条 + 场景一起更新
   * 另外：聚焦全选、Esc 撤销、↑/↓（Shift 加倍）微调一步。
   */
  var NUMBER_FIELDS = [
    { key: 'sectionY', chip: 'pos-val', slider: 'pos', err: 'pos-err', min: -2,   max: 4,   step: 0.01, digits: 2, unit: ''  },
    { key: 'rx',       chip: 'rx-val',  slider: 'rx',  err: 'rx-err',  min: -180, max: 180, step: 1,    digits: 0, unit: '°' },
    { key: 'ry',       chip: 'ry-val',  slider: 'ry',  err: 'ry-err',  min: -180, max: 180, step: 1,    digits: 0, unit: '°' },
    { key: 'rz',       chip: 'rz-val',  slider: 'rz',  err: 'rz-err',  min: -180, max: 180, step: 1,    digits: 0, unit: '°' },
    // 立体尺寸：读写的是"当前立体"的 dims，改完要重建网格
    { key: 'dimH',     chip: 'dim-h-val',    slider: 'dim-h',    err: 'dim-h-err',    min: 0.6, max: 7,   step: 0.05, digits: 2, unit: '',
      get: function () { return SOLIDS[state.solid].dims.h; },
      set: function (v) { SOLIDS[state.solid].dims.h = v; },
      onChange: function () { rebuildFromDims(); } },
    { key: 'dimSize',  chip: 'dim-size-val', slider: 'dim-size', err: 'dim-size-err', min: 0.4, max: 4.0, step: 0.05, digits: 2, unit: '',
      get: function () { return SOLIDS[state.solid].dims.size; },
      set: function (v) { SOLIDS[state.solid].dims.size = v; },
      onChange: function () { rebuildFromDims(); } }
  ];
  var FIELD_BY_KEY = {};   // 供重置按钮按 key 取到对应字段

  function setupNumberChip(f) {
    var chip = document.getElementById(f.chip);
    var slider = document.getElementById(f.slider);
    var err = document.getElementById(f.err);
    if (!chip || !slider) return;

    // 默认读写 state[key]；立体尺寸那两个用 get/set 读写各自的 dims
    function current() { return f.get ? f.get() : state[f.key]; }
    function store(v) { if (f.set) f.set(v); else state[f.key] = v; }

    function format(v) { return v.toFixed(f.digits) + f.unit; }
    function parse() {
      var raw = chip.value.replace(/[°\s]/g, '');
      if (raw === '') return null;
      var v = Number(raw);
      return isFinite(v) ? v : null;
    }
    function snap(v) { return Math.round((v - f.min) / f.step) * f.step + f.min; }
    function showErr(msg) {
      chip.classList.add('invalid');
      err.textContent = msg;
      err.hidden = false;
    }
    function clearErr() { chip.classList.remove('invalid'); err.hidden = true; }
    function restore() { chip.value = format(current()); clearErr(); }

    function commit() {
      var v = parse();
      if (v === null) { showErr('请输入数字，例如 ' + format(current())); return false; }
      if (v < f.min - 1e-9 || v > f.max + 1e-9) {
        showErr('超出范围（' + f.min + ' ~ ' + f.max + f.unit + '），请重新输入');
        return false;
      }
      f.setValue(v);
      return true;
    }

    // 供重置按钮 / 预设按钮 / 内部统一写值；quiet = 不立刻重算（批量时用）
    f.setValue = function (v, quiet) {
      v = snap(Math.min(f.max, Math.max(f.min, v)));
      clearErr();
      chip.value = format(v);
      slider.value = String(v);
      store(v);
      if (!quiet) {
        if (f.onChange) f.onChange(); else updateSection();
      }
    };
    f.current = current;
    FIELD_BY_KEY[f.key] = f;

    // 滑条和输入框双向同步
    slider.addEventListener('input', function () {
      f.setValue(parseFloat(slider.value));
    });

    chip.addEventListener('focus', function () { chip.select(); });
    chip.addEventListener('input', clearErr);          // 一改就撤掉红框
    chip.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (commit()) chip.select();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        restore();
        chip.blur();
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        var cur = parse();
        var base = (cur === null) ? current() : cur;
        var stepV = (e.shiftKey ? 10 : 1) * f.step;
        var nv = base + (e.key === 'ArrowUp' ? stepV : -stepV);
        chip.value = format(Math.min(f.max, Math.max(f.min, snap(nv))));
        commit();
      }
    });
    chip.addEventListener('blur', function () {
      if (!commit()) restore();      // 失焦时仍非法 → 回退到当前有效值
    });

    restore();
  }

  NUMBER_FIELDS.forEach(setupNumberChip);

  /* ---- 立体尺寸：改了就按新 dims 重建网格（保留当前观察角度）---- */
