<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>书页 · 謎狐怪童</title>
<meta name="description" content="《謎狐怪童》（植芝理一）全三卷扫描版在线翻阅：双页对开、日漫右起、纸张翻转。" />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="css/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23181512'/%3E%3Cpath d='M9 8.5c3-1.2 5.6-1 7 0 1.4-1 4-1.2 7 0v13c-3-1.2-5.6-1-7 0-1.4-1-4-1.2-7 0z' fill='none' stroke='%23d08c5a' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 8.7v12.5' stroke='%23d08c5a' stroke-width='1.4'/%3E%3C/svg%3E" />
<style>
  /* 博客这边额外的几处：返回链接、开卷说明、键盘焦点、出错页 */
  .topbar-actions a.btn { text-decoration: none; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 10px; }

  .intake { max-width: 1180px; margin: 0 auto 26px; }
  .intake h1 { margin: 0 0 10px; font-size: 23px; font-weight: 650; letter-spacing: -.01em; }
  .intake p { margin: 0; max-width: 720px; color: var(--muted); font-size: 13.5px; line-height: 1.85; }
  .intake .hint { margin-top: 9px; color: var(--dim); font-size: 12.5px; }
  .intake kbd {
    display: inline-block; min-width: 17px; padding: 1px 5px; margin: 0 1px;
    border: 1px solid var(--line-2); border-radius: 4px; background: rgba(255, 255, 255, .05);
    font: 500 11.5px/1.6 "Segoe UI", sans-serif; text-align: center; color: var(--muted);
  }

  .fatal { max-width: 560px; margin: 16vh auto 0; padding: 0 24px; }
  .fatal h1 { font-size: 20px; font-weight: 650; margin: 0 0 12px; }
  .fatal p { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0 0 10px; }
  .fatal a { color: var(--accent); }
</style>
</head>
<body>

<svg id="icon-sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.2c2.6-1.1 5-1 6.8 0 1.8-1 4.2-1.1 6.8 0v13.6c-2.6-1.1-5-1-6.8 0-1.8-1-4.2-1.1-6.8 0z"/><path d="M11 5.2v13.6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5.5-7 6.5 7 6.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5.5 7 6.5-7 6.5"/></symbol>
    <symbol id="i-single" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1.4"/></symbol>
    <symbol id="i-spread" viewBox="0 0 24 24"><path d="M3.5 5.5h7.2v13H3.5zM13.3 5.5h7.2v13h-7.2z"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4.5h4.5M20 9V4.5h-4.5M4 15v4.5h4.5M20 15v4.5h-4.5"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M10.5 7.8v5.4M7.8 10.5h5.4"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M7.8 10.5h5.4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.5 5.2 5.5.8-4 3.9.95 5.6L12 16.9 7.05 19.5 8 13.9 4 10l5.5-.8z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="m12 4 2.5 5.2 5.5.8-4 3.9.95 5.6L12 16.9 7.05 19.5 8 13.9 4 10l5.5-.8z" fill="currentColor"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.2 1-1.2 1.9v.4"/><path d="M12 17.2h.01"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
  </defs>
</svg>

<!-- ============================ 书架 ============================ -->
<section id="view-library" class="view is-active">
  <header class="topbar">
    <div class="brand">
      <svg class="logo"><use href="#i-book"/></svg>
      <div class="brand-text">
        <strong>书页</strong>
        <span>謎狐怪童 · 全三卷</span>
      </div>
    </div>
    <div class="searchbox">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="搜索书名" autocomplete="off" spellcheck="false" />
    </div>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="../" title="返回博客首页" aria-label="返回博客首页"><svg class="ic"><use href="#i-left"/></svg><span>回博客</span></a>
      <button class="btn btn-icon btn-ghost" id="btn-settings" title="设置"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <main class="library-main">
    <section class="intake">
      <h1>謎狐怪童</h1>
      <p>植芝理一 作 · 東立中文版 · 扫描单行本三卷，共 532 页。点封面开读：封面单独一屏，之后双页对开，翻页时纸张绕书脊卷过去。</p>
      <p class="hint">日漫从右往左翻 —— 画面左侧三分之一是「下一页」。进度和书签存在你自己的浏览器里，换设备不同步。快捷键按 <kbd>?</kbd>。</p>
    </section>

    <section class="shelf-wrap" id="shelf-wrap">
      <div class="section-head">
        <h2>书架 <span class="count" id="shelf-count"></span></h2>
        <div class="seg" id="shelf-sort">
          <button data-sort="recent" class="is-active">最近在读</button>
          <button data-sort="added">卷序</button>
          <button data-sort="title">书名</button>
        </div>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>
  </main>
</section>

<!-- ============================ 阅读器 ============================ -->
<section id="view-reader" class="view">
  <div id="stage"></div>

  <div class="ui-layer" id="uiLayer">
    <header class="reader-top" id="readerTop">
      <button class="btn btn-icon btn-ghost" id="btn-back" title="返回书架 (Esc)"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="reader-title">
        <strong id="book-title">—</strong>
        <span id="book-sub"></span>
      </div>
      <div class="reader-top-actions">
        <button class="btn btn-icon btn-ghost" id="btn-bookmark" title="加入书签 (B)"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-toc" title="目录 (T)"><svg class="ic"><use href="#i-list"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-thumbs" title="页面缩略图 (G)"><svg class="ic"><use href="#i-grid"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-fullscreen" title="全屏 (F)"><svg class="ic"><use href="#i-expand"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-help" title="快捷键 (?)"><svg class="ic"><use href="#i-help"/></svg></button>
      </div>
    </header>

    <footer class="reader-bottom" id="readerBottom">
      <button class="btn btn-icon btn-ghost" id="btn-prev" title="上一页"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="progress-wrap">
        <div class="page-label"><span id="page-label">1 / 1</span><span id="spread-label"></span></div>
        <div class="slider" id="slider">
          <div class="slider-track"><div class="slider-fill" id="slider-fill"></div></div>
          <input type="range" id="page-range" min="0" max="0" value="0" step="1" aria-label="翻页" />
        </div>
      </div>
      <button class="btn btn-icon btn-ghost" id="btn-next" title="下一页"><svg class="ic"><use href="#i-right"/></svg></button>
      <div class="divider-v"></div>
      <div class="reader-tools">
        <button class="btn btn-icon btn-ghost" id="btn-mode" title="阅读方向 (M)"><svg class="ic"><use href="#i-book"/></svg><em id="mode-badge">日漫</em></button>
        <button class="btn btn-icon btn-ghost" id="btn-layout" title="单页 / 双页 (D)"><svg class="ic"><use href="#i-single"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-zoomin" title="放大 (+)"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-zoomout" title="缩小 (-)"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
        <button class="btn btn-icon btn-ghost" id="btn-fit" title="适应窗口"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
    </footer>

    <aside class="side-panel" id="sidePanel" hidden>
      <div class="side-head">
        <div class="seg side-tabs" id="side-tabs">
          <button data-tab="toc">目录</button>
          <button data-tab="thumbs">缩略图</button>
          <button data-tab="marks">书签</button>
        </div>
        <button class="btn btn-icon btn-ghost" id="btn-side-close"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
      <div class="side-body" id="sideBody"></div>
    </aside>

  </div>

  <div class="toast" id="toast"></div>
</section>

<!-- ============================ 全局加载 ============================ -->
<div id="loading" class="loading" hidden>
  <div><div class="spinner"></div><span id="loading-text">正在打开…</span></div>
</div>

<!-- ============================ 弹层 ============================ -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="btn btn-icon btn-ghost" id="modal-close"><svg class="ic"><use href="#i-close"/></svg></button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
